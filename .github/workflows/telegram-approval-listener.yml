name: Telegram Approval Listener

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  listen:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'i indir
        uses: actions/checkout@v4

      - name: Check Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import subprocess

          TOKEN = os.environ["TOKEN"]

          def telegram(method, data):
              url = f"https://api.telegram.org/bot{TOKEN}/{method}"
              encoded = urllib.parse.urlencode(data).encode()
              request = urllib.request.Request(
                  url,
                  data=encoded,
                  method="POST"
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode())

          print("==========================================")
          print("SHADOW ARCHIVE TELEGRAM LISTENER")
          print("==========================================")

          updates = telegram("getUpdates", {})
          results = updates.get("result", [])

          if not results:
              print("NO NEW TELEGRAM UPDATES")
              raise SystemExit(0)

          last_update_id = None

          for update in results:
              last_update_id = update["update_id"]

              callback = update.get("callback_query")

              if not callback:
                  continue

              action = callback.get("data")
              callback_id = callback.get("id")
              message = callback.get("message")

              print("BUTTON CLICK DETECTED")
              print("ACTION:", action)

              try:
                  telegram(
                      "answerCallbackQuery",
                      {
                          "callback_query_id": callback_id
                      }
                  )
              except Exception as e:
                  print("CALLBACK ERROR:", e)

              if action in ["topic_approve", "approve"]:
                  print("TOPIC APPROVED")

                  text = (
                      "🤖 SHADOW ARCHIVE\n\n"
                      "✅ KONU ONAYLANDI\n\n"
                      "Video üretim sistemi başlatılıyor..."
                  )

                  result = subprocess.run(
                      [
                          "gh",
                          "workflow",
                          "run",
                          "shadow-archive-master.yml",
                          "--repo",
                          os.environ["GITHUB_REPOSITORY"]
                      ],
                      capture_output=True,
                      text=True
                  )

                  print("GH STDOUT:")
                  print(result.stdout)

                  print("GH STDERR:")
                  print(result.stderr)

                  if result.returncode != 0:
                      text = (
                          "❌ MASTER WORKFLOW HATASI\n\n"
                          "Video üretimi başlatılamadı."
                      )

              elif action in ["topic_reject", "reject"]:
                  text = (
                      "🤖 SHADOW ARCHIVE\n\n"
                      "❌ KONU REDDEDİLDİ\n\n"
                      "Bu konu için video oluşturulmayacak."
                  )

              elif action == "publish_approve":
                  print("PUBLISH APPROVED")

                  text = (
                      "🤖 SHADOW ARCHIVE\n\n"
                      "▶️ YAYIN ONAYLANDI\n\n"
                      "YouTube yükleme sistemi başlatılıyor..."
                  )

                  result = subprocess.run(
                      [
                          "gh",
                          "workflow",
                          "run",
                          "Shadow Archive - YouTube Private Upload",
                          "--repo",
                          os.environ["GITHUB_REPOSITORY"]
                      ],
                      capture_output=True,
                      text=True
                  )

                  print("GH STDOUT:")
                  print(result.stdout)

                  print("GH STDERR:")
                  print(result.stderr)

                  if result.returncode != 0:
                      text = (
                          "❌ YOUTUBE WORKFLOW HATASI\n\n"
                          "GitHub Actions kontrol edilmeli."
                      )

              elif action == "publish_reject":
                  text = (
                      "🤖 SHADOW ARCHIVE\n\n"
                      "❌ YAYIN REDDEDİLDİ\n\n"
                      "Video yayınlanmayacak."
                  )

              elif action == "change_time":
                  text = (
                      "🕐 SHADOW ARCHIVE\n\n"
                      "Yeni yayın saati bekleniyor.\n\n"
                      "Örnek:\n"
                      "12:00\n"
                      "20:00\n"
                      "21:00"
                  )

              else:
                  text = (
                      "⚠️ SHADOW ARCHIVE\n\n"
                      "Bilinmeyen Telegram işlemi."
                  )

              if message:
                  chat_id = message["chat"]["id"]
                  message_id = message["message_id"]

                  try:
                      telegram(
                          "editMessageText",
                          {
                              "chat_id": chat_id,
                              "message_id": message_id,
                              "text": text
                          }
                      )

                      print("TELEGRAM MESSAGE UPDATED")

                  except Exception as e:
                      print("MESSAGE UPDATE ERROR:", e)

          if last_update_id is not None:
              telegram(
                  "getUpdates",
                  {
                      "offset": last_update_id + 1
                  }
              )

              print("UPDATES CONFIRMED")

          print("==========================================")
          print("TELEGRAM CHECK COMPLETED")
          print("==========================================")
          PY
