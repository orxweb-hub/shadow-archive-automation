name: Telegram Approval Listener

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  listen:
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import subprocess

          token = os.environ["TOKEN"]

          def telegram(method, data):
              url = f"https://api.telegram.org/bot{token}/{method}"
              encoded = urllib.parse.urlencode(data).encode()

              request = urllib.request.Request(
                  url,
                  data=encoded,
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode())

          print("==========================================")
          print("SHADOW ARCHIVE TELEGRAM LISTENER")
          print("==========================================")

          updates = telegram("getUpdates", {})
          results = updates.get("result", [])

          if not results:
              print("NO NEW TELEGRAM UPDATES")
              raise SystemExit(0)

          last_update_id = None

          for update in results:

              last_update_id = update["update_id"]

              callback = update.get("callback_query")

              if not callback:
                  continue

              action = callback.get("data")
              callback_id = callback.get("id")
              message = callback.get("message")

              print("BUTTON CLICK DETECTED")
              print("ACTION:", action)

              # Telegram butonundaki yüklenme işaretini kapat
              try:
                  telegram(
                      "answerCallbackQuery",
                      {
                          "callback_query_id": callback_id
                      }
                  )

                  print("CALLBACK ANSWERED")

              except Exception as e:
                  print("CALLBACK ANSWER SKIPPED:", e)

              # ==========================================
              # ONAYLA
              # ==========================================

              if action == "approve":

                  text = (
                      "SHADOW ARCHIVE - YAYIN ONAYLANDI\n\n"
                      "MV JOYITA\n\n"
                      "YouTube yukleme sistemi baslatiliyor...\n\n"
                      "Video: PRIVATE"
                  )

                  # YouTube Private Upload workflow'unu başlat
                  print("STARTING YOUTUBE UPLOAD WORKFLOW...")

                  result = subprocess.run(
                      [
                          "gh",
                          "workflow",
                          "run",
                          "Shadow Archive - YouTube Private Upload"
                      ],
                      capture_output=True,
                      text=True
                  )

                  print("GH STDOUT:", result.stdout)
                  print("GH STDERR:", result.stderr)

                  if result.returncode == 0:
                      print("YOUTUBE WORKFLOW STARTED")

                  else:
                      print("YOUTUBE WORKFLOW ERROR")
                      print("Return code:", result.returncode)

                      text = (
                          "SHADOW ARCHIVE - HATA\n\n"
                          "YouTube yukleme workflow'u baslatilamadi.\n\n"
                          "GitHub Actions kontrol edilmeli."
                      )

              # ==========================================
              # REDDET
              # ==========================================

              elif action == "reject":

                  text = (
                      "SHADOW ARCHIVE - YAYIN REDDEDILDI\n\n"
                      "MV JOYITA\n\n"
                      "Video yayinlanmayacak."
                  )

              # ==========================================
              # SAATI DEĞİŞTİR
              # ==========================================

              elif action == "change_time":

                  text = (
                      "SHADOW ARCHIVE - SAAT DEGISIKLIGI\n\n"
                      "MV JOYITA\n\n"
                      "Yeni yayin saati bekleniyor."
                  )

              else:

                  text = "Bilinmeyen islem."

              # ==========================================
              # TELEGRAM MESAJINI GÜNCELLE
              # ==========================================

              if message:

                  chat_id = message["chat"]["id"]
                  message_id = message["message_id"]

                  try:

                      result = telegram(
                          "editMessageText",
                          {
                              "chat_id": chat_id,
                              "message_id": message_id,
                              "text": text
                          }
                      )

                      print("TELEGRAM MESSAGE UPDATED")
                      print(result)

                  except Exception as e:

                      print("MESSAGE UPDATE ERROR:", e)

          # ==========================================
          # İŞLENEN TELEGRAM MESAJLARINI TEMİZLE
          # ==========================================

          if last_update_id is not None:

              telegram(
                  "getUpdates",
                  {
                      "offset": last_update_id + 1
                  }
              )

              print("UPDATES CONFIRMED")

          print("==========================================")
          print("TELEGRAM CHECK COMPLETED")
          print("==========================================")

          PY
