name: Telegram Approval Listener

on:
  workflow_dispatch:
  schedule:
    - cron: "*/1 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  listen:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'i indir
        uses: actions/checkout@v4

      - name: Check Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import subprocess

          TOKEN = os.environ["TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]

          def telegram(method, data=None):
              url = f"https://api.telegram.org/bot{TOKEN}/{method}"

              if data:
                  encoded = urllib.parse.urlencode(data).encode()
                  request = urllib.request.Request(
                      url,
                      data=encoded,
                      method="POST"
                  )
              else:
                  request = urllib.request.Request(
                      url,
                      method="POST"
                  )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode()
                  )

          def find_workflow(workflow_name):

              result = subprocess.run(
                  [
                      "gh",
                      "workflow",
                      "list",
                      "--repo",
                      REPO,
                      "--limit",
                      "100",
                      "--json",
                      "name,path"
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  print("WORKFLOW LIST ERROR:")
                  print(result.stderr)
                  return None

              workflows = json.loads(
                  result.stdout
              )

              for workflow in workflows:

                  if workflow.get("name") == workflow_name:

                      print(
                          "WORKFLOW BULUNDU:",
                          workflow
                      )

                      return workflow.get("path")

              print(
                  "WORKFLOW BULUNAMADI:",
                  workflow_name
              )

              return None

          def run_workflow(workflow_name):

              workflow_path = find_workflow(
                  workflow_name
              )

              if not workflow_path:
                  return False

              print(
                  "WORKFLOW BAŞLATILIYOR:",
                  workflow_path
              )

              result = subprocess.run(
                  [
                      "gh",
                      "workflow",
                      "run",
                      workflow_path,
                      "--repo",
                      REPO
                  ],
                  capture_output=True,
                  text=True
              )

              print(
                  "GH STDOUT:",
                  result.stdout
              )

              print(
                  "GH STDERR:",
                  result.stderr
              )

              print(
                  "RETURN CODE:",
                  result.returncode
              )

              return result.returncode == 0

          print("==========================================")
          print("SHADOW ARCHIVE TELEGRAM LISTENER")
          print("==========================================")

          updates = telegram(
              "getUpdates",
              {
                  "timeout": 5,
                  "allowed_updates": json.dumps(
                      ["callback_query"]
                  )
              }
          )

          results = updates.get(
              "result",
              []
          )

          print(
              "UPDATE SAYISI:",
              len(results)
          )

          if not results:

              print(
                  "NO NEW TELEGRAM UPDATES"
              )

              raise SystemExit(0)

          last_update_id = None

          for update in results:

              last_update_id = update[
                  "update_id"
              ]

              callback = update.get(
                  "callback_query"
              )

              if not callback:
                  continue

              action = callback.get(
                  "data"
              )

              callback_id = callback.get(
                  "id"
              )

              message = callback.get(
                  "message"
              )

              print("==========================================")
              print("BUTTON CLICK DETECTED")
              print("ACTION:", action)
              print("UPDATE ID:", last_update_id)
              print("==========================================")

              try:

                  telegram(
                      "answerCallbackQuery",
                      {
                          "callback_query_id":
                              callback_id
                      }
                  )

              except Exception as e:

                  print(
                      "CALLBACK ERROR:",
                      e
                  )

              if action == "publish_approve":

                  print(
                      "PUBLISH APPROVED"
                  )

                  success = run_workflow(
                      "Shadow Archive - YouTube Private Upload"
                  )

                  if success:

                      text = (
                          "🤖 SHADOW ARCHIVE\n\n"
                          "▶️ YAYIN ONAYLANDI\n\n"
                          "☁️ YouTube yükleme sistemi başlatıldı.\n\n"
                          "📱 Short #1 → 10:00\n"
                          "🎬 Ana Video → 13:00\n"
                          "📱 Short #2 → 21:00"
                      )

                  else:

                      text = (
                          "❌ YOUTUBE WORKFLOW HATASI\n\n"
                          "YouTube workflow başlatılamadı."
                      )

              elif action == "publish_reject":

                  text = (
                      "🤖 SHADOW ARCHIVE\n\n"
                      "❌ YAYIN REDDEDİLDİ"
                  )

              elif action == "topic_approve":

                  success = run_workflow(
                      "Shadow Archive - Master Production"
                  )

                  if success:

                      text = (
                          "🤖 SHADOW ARCHIVE\n\n"
                          "✅ KONU ONAYLANDI\n\n"
                          "🎬 Üretim başlatıldı."
                      )

                  else:

                      text = (
                          "❌ MASTER WORKFLOW HATASI"
                      )

              elif action == "topic_reject":

                  text = (
                      "🤖 SHADOW ARCHIVE\n\n"
                      "❌ KONU REDDEDİLDİ"
                  )

              elif action == "change_time":

                  text = (
                      "🕐 SHADOW ARCHIVE\n\n"
                      "Yeni yayın saati özelliği hazırlanıyor."
                  )

              else:

                  text = (
                      "⚠️ SHADOW ARCHIVE\n\n"
                      "Bilinmeyen işlem."
                  )

              if message:

                  chat_id = message[
                      "chat"
                  ][
                      "id"
                  ]

                  message_id = message[
                      "message_id"
                  ]

                  try:

                      telegram(
                          "editMessageText",
                          {
                              "chat_id":
                                  chat_id,
                              "message_id":
                                  message_id,
                              "text":
                                  text,
                              "reply_markup":
                                  json.dumps(
                                      {
                                          "inline_keyboard":
                                              []
                                      }
                                  )
                          }
                      )

                      print(
                          "TELEGRAM MESSAGE UPDATED"
                      )

                  except Exception as e:

                      print(
                          "MESSAGE UPDATE ERROR:",
                          e
                      )

          if last_update_id is not None:

              try:

                  telegram(
                      "getUpdates",
                      {
                          "offset":
                              last_update_id + 1
                      }
                  )

                  print(
                      "UPDATES CONFIRMED"
                  )

              except Exception as e:

                  print(
                      "OFFSET ERROR:",
                      e
                  )

          print("==========================================")
          print("TELEGRAM CHECK COMPLETED")
          print("==========================================")
          PY
