name: Telegram Approval Listener

on:
  workflow_dispatch:
  schedule:
    - cron: "*/1 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest

    steps:

      - name: Repository'i indir
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: GitHub CLI kontrol
        run: |
          gh --version

      - name: Telegram Listener
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |

          python - <<'PY'

          import os
          import json
          import urllib.request
          import urllib.parse
          import subprocess
          import sys


          TOKEN = os.environ["TOKEN"]
          REPO = os.environ["REPO"]


          # ==========================================================
          # TELEGRAM API
          # ==========================================================

          def telegram(method, data=None):

              url = (
                  f"https://api.telegram.org/"
                  f"bot{TOKEN}/{method}"
              )

              if data:

                  encoded = (
                      urllib.parse.urlencode(
                          data
                      ).encode()
                  )

                  request = urllib.request.Request(
                      url,
                      data=encoded,
                      method="POST"
                  )

              else:

                  request = urllib.request.Request(
                      url,
                      method="POST"
                  )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  return json.loads(
                      response.read().decode()
                  )


          # ==========================================================
          # YOUTUBE WORKFLOW BAŞLAT
          # ==========================================================

          def run_youtube_workflow(
              production_id
          ):

              print("")
              print(
                  "=========================================="
              )
              print(
                  "YOUTUBE PRIVATE UPLOAD BAŞLATILIYOR"
              )
              print(
                  "=========================================="
              )

              print(
                  "REPO:",
                  REPO
              )

              print(
                  "PRODUCTION ID:",
                  production_id
              )

              workflow_file = (
                  ".github/workflows/"
                  "youtube-private-upload.yml"
              )

              print(
                  "WORKFLOW:",
                  workflow_file
              )

              command = [
                  "gh",
                  "workflow",
                  "run",
                  workflow_file,
                  "--repo",
                  REPO,
                  "--ref",
                  "main",
                  "--field",
                  f"production_id={production_id}"
              ]

              print("")
              print(
                  "GH KOMUTU ÇALIŞTIRILIYOR..."
              )

              result = subprocess.run(
                  command,
                  capture_output=True,
                  text=True
              )

              print(
                  "GH RETURN CODE:",
                  result.returncode
              )

              print(
                  "GH STDOUT:"
              )

              print(
                  result.stdout
              )

              print(
                  "GH STDERR:"
              )

              print(
                  result.stderr
              )

              if result.returncode == 0:

                  print("")
                  print(
                      "✅ YOUTUBE WORKFLOW BAŞLATILDI."
                  )

                  return True

              print("")
              print(
                  "❌ YOUTUBE WORKFLOW BAŞLATILAMADI."
              )

              return False


          # ==========================================================
          # BAŞLANGIÇ
          # ==========================================================

          print(
              "=========================================="
          )

          print(
              "SHADOW ARCHIVE TELEGRAM LISTENER"
          )

          print(
              "=========================================="
          )


          # ==========================================================
          # BOT KONTROL
          # ==========================================================

          me = telegram(
              "getMe"
          )

          if not me.get("ok"):

              print(
                  "❌ BOT API HATASI"
              )

              sys.exit(1)


          print(
              "BOT:",
              me["result"].get("username")
          )


          # ==========================================================
          # WEBHOOK KONTROL
          # ==========================================================

          webhook = telegram(
              "getWebhookInfo"
          )

          if webhook.get("ok"):

              info = webhook["result"]

              webhook_url = info.get(
                  "url",
                  ""
              )

              if webhook_url:

                  print(
                      "❌ WEBHOOK AKTİF:"
                  )

                  print(
                      webhook_url
                  )

                  print(
                      "getUpdates kullanılamaz."
                  )

                  sys.exit(1)

              print(
                  "PENDING UPDATE:",
                  info.get(
                      "pending_update_count",
                      0
                  )
              )


          # ==========================================================
          # TELEGRAM UPDATE AL
          # ==========================================================

          updates = telegram(
              "getUpdates",
              {
                  "timeout": 5,
                  "allowed_updates": json.dumps(
                      [
                          "callback_query"
                      ]
                  )
              }
          )


          if not updates.get("ok"):

              print(
                  "❌ GETUPDATES HATASI:"
              )

              print(
                  updates
              )

              sys.exit(1)


          results = updates.get(
              "result",
              []
          )


          print(
              "UPDATE SAYISI:",
              len(results)
          )


          if not results:

              print(
                  "NO NEW TELEGRAM UPDATES"
              )

              sys.exit(0)


          # ==========================================================
          # UPDATE İŞLEME
          # ==========================================================

          successful_update_ids = []

          failed_update_ids = []


          for update in results:

              update_id = update.get(
                  "update_id"
              )

              callback = update.get(
                  "callback_query"
              )


              if not callback:

                  continue


              raw_action = callback.get(
                  "data",
                  ""
              )

              callback_id = callback.get(
                  "id"
              )

              message = callback.get(
                  "message"
              )


              print("")
              print(
                  "=========================================="
              )

              print(
                  "BUTTON CLICK DETECTED"
              )

              print(
                  "UPDATE ID:",
                  update_id
              )

              print(
                  "RAW ACTION:",
                  raw_action
              )

              print(
                  "=========================================="
              )


              # ======================================================
              # CALLBACK'E BASILDI GERİ BİLDİRİMİ
              # ======================================================

              try:

                  telegram(
                      "answerCallbackQuery",
                      {
                          "callback_query_id":
                              callback_id
                      }
                  )

              except Exception as e:

                  print(
                      "CALLBACK ANSWER ERROR:",
                      e
                  )


              # ======================================================
              # ACTION AYIR
              # ======================================================

              action = raw_action

              production_id = None


              if ":" in raw_action:

                  action, production_id = (
                      raw_action.split(
                          ":",
                          1
                      )
                  )

                  action = action.strip()

                  production_id = (
                      production_id.strip()
                  )


              print(
                  "ACTION:",
                  action
              )

              print(
                  "PRODUCTION ID:",
                  production_id
              )


              text = ""

              workflow_started = False


              # ======================================================
              # YAYINLA
              # ======================================================

              if action == "publish_approve":

                  print("")
                  print(
                      "▶️ PUBLISH APPROVED"
                  )


                  if not production_id:

                      print(
                          "❌ PRODUCTION ID YOK"
                      )

                      text = (
                          "❌ SHADOW ARCHIVE\n\n"
                          "Production ID bulunamadı.\n\n"
                          "Bu mesaj eski bir onay mesajı "
                          "olabilir."
                      )

                  else:

                      workflow_started = (
                          run_youtube_workflow(
                              production_id
                          )
                      )


                      if workflow_started:

                          text = (
                              "🤖 SHADOW ARCHIVE\n\n"
                              "▶️ YAYIN ONAYLANDI\n\n"
                              f"🆔 Production ID:\n"
                              f"{production_id}\n\n"
                              "☁️ YouTube Private Upload "
                              "başlatıldı.\n\n"
                              "📱 Short #1 → 09:00\n"
                              "🎬 Ana Video → 12:00\n"
                              "📱 Short #2 → 21:00"
                          )

                      else:

                          text = (
                              "❌ SHADOW ARCHIVE\n\n"
                              "YouTube workflow "
                              "başlatılamadı.\n\n"
                              f"🆔 Production ID:\n"
                              f"{production_id}\n\n"
                              "⚠️ Callback korunuyor. "
                              "Listener tekrar deneyecek."
                          )


              # ======================================================
              # YAYINLAMA
              # ======================================================

              elif action == "publish_reject":

                  text = (
                      "🤖 SHADOW ARCHIVE\n\n"
                      "❌ YAYIN REDDEDİLDİ\n\n"
                      f"🆔 Production ID:\n"
                      f"{production_id or 'Bilinmiyor'}"
                  )

                  workflow_started = True


              # ======================================================
              # KONU ONAY
              # ======================================================

              elif action == "topic_approve":

                  print(
                      "TOPIC APPROVED"
                  )

                  print(
                      "⚠️ Eski topic approval sistemi."
                  )

                  text = (
                      "⚠️ SHADOW ARCHIVE\n\n"
                      "Bu eski konu onay butonudur.\n\n"
                      "Yeni sistemde konu zaten "
                      "Master Production öncesinde "
                      "hazırlanıyor."
                  )

                  workflow_started = True


              # ======================================================
              # KONU RED
              # ======================================================

              elif action == "topic_reject":

                  text = (
                      "🤖 SHADOW ARCHIVE\n\n"
                      "❌ KONU REDDEDİLDİ"
                  )

                  workflow_started = True


              # ======================================================
              # SAAT DEĞİŞTİR
              # ======================================================

              elif action == "change_time":

                  text = (
                      "🕐 SHADOW ARCHIVE\n\n"
                      "Yeni yayın saati özelliği "
                      "hazırlanıyor."
                  )

                  workflow_started = True


              # ======================================================
              # BİLİNMEYEN
              # ======================================================

              else:

                  print(
                      "⚠️ BİLİNMEYEN ACTION:"
                  )

                  print(
                      raw_action
                  )

                  text = (
                      "⚠️ SHADOW ARCHIVE\n\n"
                      "Bilinmeyen işlem.\n\n"
                      f"İşlem: {raw_action}"
                  )

                  workflow_started = True


              # ======================================================
              # TELEGRAM MESAJINI GÜNCELLE
              # ======================================================

              if message:

                  chat_id = message["chat"]["id"]

                  message_id = (
                      message["message_id"]
                  )


                  try:

                      telegram(
                          "editMessageText",
                          {
                              "chat_id": chat_id,
                              "message_id": message_id,
                              "text": text,
                              "reply_markup": json.dumps(
                                  {
                                      "inline_keyboard": []
                                  },
                                  ensure_ascii=False
                              )
                          }
                      )

                      print(
                          "TELEGRAM MESSAGE UPDATED"
                      )

                  except Exception as e:

                      print(
                          "MESSAGE UPDATE ERROR:",
                          e
                      )


              # ======================================================
              # EN ÖNEMLİ KISIM
              #
              # SADECE BAŞARILI İŞLENEN UPDATE'İ
              # TELEGRAM KUYRUĞUNDAN ÇIKAR.
              #
              # YOUTUBE WORKFLOW BAŞLAMAZSA:
              # UPDATE SİLİNMEZ.
              # ======================================================

              if workflow_started:

                  successful_update_ids.append(
                      update_id
                  )

              else:

                  failed_update_ids.append(
                      update_id
                  )


          # ==========================================================
          # UPDATE OFFSET
          # ==========================================================

          if successful_update_ids:

              highest_successful_id = max(
                  successful_update_ids
              )

              print("")
              print(
                  "=========================================="
              )

              print(
                  "BAŞARILI UPDATE'LER ONAYLANIYOR"
              )

              print(
                  "OFFSET:",
                  highest_successful_id + 1
              )

              print(
                  "=========================================="
              )


              try:

                  telegram(
                      "getUpdates",
                      {
                          "offset":
                              highest_successful_id + 1,
                          "timeout": 1
                      }
                  )

                  print(
                      "✅ UPDATE'LER ONAYLANDI."
                  )

              except Exception as e:

                  print(
                      "OFFSET ERROR:",
                      e
                  )


          if failed_update_ids:

              print("")
              print(
                  "=========================================="
              )

              print(
                  "⚠️ BAŞARISIZ UPDATE'LER KORUNDU"
              )

              print(
                  "UPDATE ID:",
                  failed_update_ids
              )

              print(
                  "Telegram callback tekrar "
                  "işlenebilir."
              )

              print(
                  "=========================================="
              )


          print("")
          print(
              "=========================================="
          )

          print(
              "TELEGRAM LISTENER COMPLETED"
          )

          print(
              "=========================================="

          )

          PY
