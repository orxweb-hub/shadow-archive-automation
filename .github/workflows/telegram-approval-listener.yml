name: Telegram Approval Listener

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  listen:
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          token = os.environ["TOKEN"]

          def telegram(method, data):
              url = f"https://api.telegram.org/bot{token}/{method}"
              encoded = urllib.parse.urlencode(data).encode()

              request = urllib.request.Request(
                  url,
                  data=encoded,
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode())

          print("Telegram kontrol ediliyor...")

          updates = telegram("getUpdates", {})

          results = updates.get("result", [])

          if not results:
              print("NO NEW TELEGRAM UPDATES")
              raise SystemExit(0)

          last_update_id = None

          for update in results:

              last_update_id = update["update_id"]

              callback = update.get("callback_query")

              if not callback:
                  continue

              action = callback.get("data")
              callback_id = callback.get("id")
              message = callback.get("message")

              print("BUTTON CLICK DETECTED")
              print("ACTION:", action)

              # Buton yüklenmesini kapat
              try:
                  telegram(
                      "answerCallbackQuery",
                      {
                          "callback_query_id": callback_id
                      }
                  )
                  print("CALLBACK ANSWERED")
              except Exception as e:
                  print("CALLBACK ANSWER SKIPPED:", e)

              if action == "approve":
                  text = (
                      "SHADOW ARCHIVE - YAYIN ONAYLANDI\n\n"
                      "MV JOYITA\n\n"
                      "Yayin sistemi baslatilacak."
                  )

              elif action == "reject":
                  text = (
                      "SHADOW ARCHIVE - YAYIN REDDEDILDI\n\n"
                      "MV JOYITA\n\n"
                      "Video yayinlanmayacak."
                  )

              elif action == "change_time":
                  text = (
                      "SHADOW ARCHIVE - SAAT DEGISIKLIGI\n\n"
                      "Yeni yayin saati bekleniyor."
                  )

              else:
                  text = "Bilinmeyen islem."

              if message:

                  chat_id = message["chat"]["id"]
                  message_id = message["message_id"]

                  try:
                      result = telegram(
                          "editMessageText",
                          {
                              "chat_id": chat_id,
                              "message_id": message_id,
                              "text": text
                          }
                      )

                      print("TELEGRAM MESSAGE UPDATED")
                      print(result)

                  except Exception as e:
                      print("MESSAGE UPDATE ERROR:", e)

          if last_update_id is not None:

              telegram(
                  "getUpdates",
                  {
                      "offset": last_update_id + 1
                  }
              )

              print("UPDATES CONFIRMED")

          print("TELEGRAM CHECK COMPLETED")
          PY
