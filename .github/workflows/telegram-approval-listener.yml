name: Telegram Approval Listener

on:
  workflow_dispatch:
  schedule:
    - cron: "*/1 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'i indir
        uses: actions/checkout@v4

      - name: Check Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          TOKEN = os.environ["TOKEN"]

          def telegram(method, data=None):
              url = f"https://api.telegram.org/bot{TOKEN}/{method}"

              if data:
                  encoded = urllib.parse.urlencode(data).encode()
                  request = urllib.request.Request(
                      url,
                      data=encoded,
                      method="POST"
                  )
              else:
                  request = urllib.request.Request(
                      url,
                      method="POST"
                  )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode()
                  )

          print("==========================================")
          print("SHADOW ARCHIVE TELEGRAM DIAGNOSTIC")
          print("==========================================")

          # 1. BOT KONTROL
          print("\n[1] BOT KONTROL")
          me = telegram("getMe")

          if me.get("ok"):
              bot = me["result"]
              print("BOT:", bot.get("username"))
              print("BOT ID:", bot.get("id"))
          else:
              print("BOT API HATASI")
              print(me)

          # 2. WEBHOOK KONTROL
          print("\n[2] WEBHOOK KONTROL")
          webhook = telegram("getWebhookInfo")

          if webhook.get("ok"):
              info = webhook["result"]
              webhook_url = info.get("url", "")

              if webhook_url:
                  print("WEBHOOK AKTIF:", webhook_url)
              else:
                  print("WEBHOOK YOK - getUpdates KULLANILABILIR")

              print("PENDING UPDATE:", info.get("pending_update_count"))
              print("LAST ERROR:", info.get("last_error_message"))
          else:
              print("WEBHOOK KONTROL HATASI")
              print(webhook)

          # 3. TELEGRAM GÜNCELLEMELERİ
          print("\n[3] TELEGRAM UPDATES")

          updates = telegram(
              "getUpdates",
              {
                  "timeout": 5
              }
          )

          if not updates.get("ok"):
              print("GETUPDATES HATASI:")
              print(updates)
              raise SystemExit(1)

          results = updates.get("result", [])

          print("UPDATE SAYISI:", len(results))

          for update in results:
              print("------------------------------------------")
              print("UPDATE ID:", update.get("update_id"))

              if "callback_query" in update:
                  callback = update["callback_query"]

                  print("BUTTON CLICK DETECTED")
                  print("ACTION:", callback.get("data"))
                  print("CALLBACK ID:", callback.get("id"))

              elif "message" in update:
                  message = update["message"]
                  print("MESSAGE UPDATE")
                  print("TEXT:", message.get("text"))

              else:
                  print("OTHER UPDATE")

          print("------------------------------------------")
          print("TELEGRAM DIAGNOSTIC COMPLETED")
          print("==========================================")
          PY
