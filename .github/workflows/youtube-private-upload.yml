name: Shadow Archive - YouTube Private Upload

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1 — CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2 — FIND LATEST MASTER PRODUCTION
      # =========================================================

      - name: Find Latest Master Production Run
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          RUN_ID=$(gh run list \
            --workflow="Shadow Archive - Master Production" \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "Master Production successful run not found."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "LATEST MASTER PRODUCTION RUN"
          echo "=========================================="
          echo "Run ID: $RUN_ID"
          echo "=========================================="

      # =========================================================
      # 3 — DOWNLOAD COMPLETE PRODUCTION PACKAGE
      # =========================================================

      - name: Download Production Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          mkdir -p production_package

          gh run download \
            "${{ steps.find_run.outputs.run_id }}" \
            --name shadow-archive-complete-production \
            --dir production_package

          echo "=========================================="
          echo "PRODUCTION PACKAGE"
          echo "=========================================="

          find production_package \
            -type f \
            -exec ls -lh {} \;

          echo "=========================================="

      # =========================================================
      # 4 — VERIFY FILES
      # =========================================================

      - name: Verify Production Files
        run: |

          echo "=========================================="
          echo "VERIFYING PRODUCTION FILES"
          echo "=========================================="

          test -f production_package/main/main_video.mp4
          test -f production_package/shorts/short_1.mp4
          test -f production_package/shorts/short_2.mp4
          test -f production_package/research/current_topic.json

          echo "✓ Main video found"
          echo "✓ Short #1 found"
          echo "✓ Short #2 found"
          echo "✓ Topic data found"

          echo ""
          echo "CURRENT TOPIC:"
          cat production_package/research/current_topic.json

          echo ""
          echo "=========================================="
          echo "ALL FILES VERIFIED"
          echo "=========================================="

      # =========================================================
      # 5 — PYTHON
      # =========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================================================
      # 6 — YOUTUBE DEPENDENCIES
      # =========================================================

      - name: Install YouTube Dependencies
        run: |

          pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # =========================================================
      # 7 — UPLOAD EVERYTHING
      # =========================================================

      - name: Upload Videos To YouTube
        env:
          YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |

          echo "=========================================="
          echo "SHADOW ARCHIVE — YOUTUBE PUBLISHER"
          echo "=========================================="

          python research/youtube/youtube_private_upload.py

          echo ""
          echo "=========================================="
          echo "YOUTUBE PUBLISHING PROCESS COMPLETE"
          echo "=========================================="
