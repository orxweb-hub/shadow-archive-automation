name: Shadow Archive - YouTube Private Upload

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python Kodunu Kontrol Et
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE — YOUTUBE PUBLISHER"
          echo "=========================================="

          echo "COMMIT:"
          git rev-parse HEAD

          echo ""
          echo "YAYIN SAATLERİ:"
          grep -n -A5 "short_1_time" research/youtube/youtube_private_upload.py
          grep -n -A5 "main_time" research/youtube/youtube_private_upload.py
          grep -n -A5 "short_2_time" research/youtube/youtube_private_upload.py

          echo ""
          echo "BEKLENEN:"
          echo "Short #1  = 10:00 Türkiye"
          echo "Ana Video  = 13:00 Türkiye"
          echo "Short #2  = 21:00 Türkiye"

          echo "=========================================="

      - name: Bugünün Master Production Run'ını Bul
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=========================================="
          echo "BUGÜNÜN ÜRETİM PAKETİ ARANIYOR"
          echo "=========================================="

          TODAY=$(TZ=Europe/Istanbul date +%Y-%m-%d)

          echo "Türkiye tarihi:"
          echo "$TODAY"

          RUN_ID=$(gh run list \
            --workflow="Shadow Archive - Master Production" \
            --status=success \
            --limit=20 \
            --json databaseId,createdAt \
            --jq --arg TODAY "$TODAY" '
              map(
                select(
                  (.createdAt | fromdateiso8601 | strftime("%Y-%m-%d")) == $TODAY
                )
              )
              | sort_by(.createdAt)
              | last
              | .databaseId
            ')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo ""
            echo "❌ BUGÜNÜN BAŞARILI MASTER PRODUCTION RUN'I BULUNAMADI."
            echo ""
            echo "Beklenen:"
            echo "Bugün üretilmiş yeni bir production paketi."
            exit 1
          fi

          echo ""
          echo "✅ BUGÜNÜN PRODUCTION RUN'I BULUNDU"
          echo "Run ID: $RUN_ID"
          echo "=========================================="

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Today's Production Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p production_package

          echo "=========================================="
          echo "BUGÜNÜN PRODUCTION PACKAGE İNDİRİLİYOR"
          echo "=========================================="

          gh run download \
            "${{ steps.find_run.outputs.run_id }}" \
            --name shadow-archive-complete-production \
            --dir production_package

          echo ""
          echo "İNDİRİLEN DOSYALAR:"
          find production_package \
            -type f \
            -exec ls -lh {} \;

          echo "=========================================="

      - name: Production Package Kontrol
        run: |
          echo "=========================================="
          echo "PRODUCTION PACKAGE KONTROL"
          echo "=========================================="

          test -f production_package/main/main_video.mp4
          test -f production_package/shorts/short_1.mp4
          test -f production_package/shorts/short_2.mp4
          test -f production_package/research/current_topic.json

          echo "✓ Ana video bulundu"
          echo "✓ Short #1 bulundu"
          echo "✓ Short #2 bulundu"
          echo "✓ Konu bilgisi bulundu"

          echo ""
          echo "BUGÜNÜN KONU BİLGİSİ:"
          cat production_package/research/current_topic.json

          echo ""
          echo "=========================================="
          echo "PRODUCTION PACKAGE HAZIR"
          echo "=========================================="

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube Dependencies
        run: |
          pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Upload Videos To YouTube
        env:
          YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE — YOUTUBE PUBLISHER"
          echo "=========================================="

          echo "Production Run:"
          echo "${{ steps.find_run.outputs.run_id }}"

          echo ""
          echo "Yayın sistemi başlatılıyor..."

          python research/youtube/youtube_private_upload.py

          echo ""
          echo "=========================================="
          echo "YOUTUBE PUBLISHING PROCESS COMPLETE"
          echo "=========================================="
