name: Shadow Archive - YouTube Private Upload

on:
  workflow_dispatch:
    inputs:
      production_id:
        description: "Yayınlanacak Production ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Production ID kontrol
        id: production
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE — YOUTUBE PUBLISHER"
          echo "=========================================="

          PRODUCTION_ID="${{ inputs.production_id }}"

          echo "Production ID:"
          echo "$PRODUCTION_ID"

          if [ -z "$PRODUCTION_ID" ]; then
            echo "❌ PRODUCTION ID BOŞ."
            exit 1
          fi

          RUN_ID="${PRODUCTION_ID##*-}"

          echo ""
          echo "Production Run ID:"
          echo "$RUN_ID"

          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "❌ GEÇERSİZ RUN ID."
            exit 1
          fi

          echo "production_id=$PRODUCTION_ID" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          echo "✅ Production ID geçerli."

      - name: Python ve Upload Kodunu Kontrol Et
        run: |
          echo "=========================================="
          echo "YOUTUBE UPLOAD KODU KONTROL"
          echo "=========================================="

          test -f research/youtube/youtube_private_upload.py

          echo "Python dosyası:"
          ls -lh research/youtube/youtube_private_upload.py

          echo ""
          echo "Upload fonksiyonu:"
          grep -n "youtube.videos().insert" research/youtube/youtube_private_upload.py

          echo ""
          echo "Python syntax kontrolü:"
          python -m py_compile research/youtube/youtube_private_upload.py

          echo "✅ Upload kodu hazır."

      - name: Production Run kontrol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=========================================="
          echo "PRODUCTION RUN KONTROL"
          echo "=========================================="

          RUN_ID="${{ steps.production.outputs.run_id }}"

          RUN_INFO=$(gh run view \
            "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --json databaseId,status,conclusion,name,createdAt)

          echo "$RUN_INFO"

          STATUS=$(echo "$RUN_INFO" | python -c '
          import json
          import sys
          data = json.load(sys.stdin)
          print(data.get("status", ""))
          ')

          CONCLUSION=$(echo "$RUN_INFO" | python -c '
          import json
          import sys
          data = json.load(sys.stdin)
          print(data.get("conclusion", ""))
          ')

          echo ""
          echo "STATUS: $STATUS"
          echo "CONCLUSION: $CONCLUSION"

          if [ "$STATUS" != "completed" ]; then
            echo "❌ PRODUCTION RUN HENÜZ TAMAMLANMAMIŞ."
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "❌ PRODUCTION RUN BAŞARILI DEĞİL."
            exit 1
          fi

          echo "✅ PRODUCTION RUN BAŞARILI."

      - name: Production Package indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=========================================="
          echo "PRODUCTION PACKAGE İNDİRİLİYOR"
          echo "=========================================="

          RUN_ID="${{ steps.production.outputs.run_id }}"

          rm -rf production_package
          mkdir -p production_package

          gh run download \
            "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name shadow-archive-complete-production \
            --dir production_package

          echo ""
          echo "İNDİRİLEN DOSYALAR:"
          find production_package -type f -exec ls -lh {} \;

          echo "=========================================="

      - name: Production Package Kontrol
        run: |
          echo "=========================================="
          echo "PRODUCTION PACKAGE KONTROL"
          echo "=========================================="

          test -f production_package/main/main_video.mp4
          test -f production_package/shorts/short_1.mp4
          test -f production_package/shorts/short_2.mp4
          test -f production_package/research/current_topic.json

          echo ""
          echo "ANA VIDEO:"
          ls -lh production_package/main/main_video.mp4

          echo ""
          echo "SHORT 1:"
          ls -lh production_package/shorts/short_1.mp4

          echo ""
          echo "SHORT 2:"
          ls -lh production_package/shorts/short_2.mp4

          echo ""
          echo "CURRENT TOPIC:"
          cat production_package/research/current_topic.json

          echo ""
          echo "✅ PRODUCTION PACKAGE TAMAM."

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: YouTube Kütüphanelerini Kur
        run: |
          python -m pip install --upgrade pip

          pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

          echo "✅ YouTube kütüphaneleri hazır."

      - name: YouTube Private Upload
        env:
          YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "=========================================="
          echo "🚀 SHADOW ARCHIVE YOUTUBE UPLOAD"
          echo "=========================================="

          if [ -z "$YOUTUBE_OAUTH_CLIENT_JSON" ]; then
            echo "❌ YOUTUBE_OAUTH_CLIENT_JSON SECRET BOŞ."
            exit 1
          fi

          if [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "❌ YOUTUBE_REFRESH_TOKEN SECRET BOŞ."
            exit 1
          fi

          echo "OAuth secretleri bulundu."

          python research/youtube/youtube_private_upload.py

          echo "=========================================="
          echo "✅ YOUTUBE UPLOAD SCRIPT TAMAMLANDI"
          echo "=========================================="

      - name: Upload Sonucu
        run: |
          echo "=========================================="
          echo "🎉 SHADOW ARCHIVE YOUTUBE İŞLEMİ TAMAMLANDI"
          echo "=========================================="
          echo "Üç video YouTube'a yüklenmiş olmalı:"
          echo "1. Short #1"
          echo "2. Ana Video"
          echo "3. Short #2"
          echo ""
          echo "Video ID'leri bir önceki adımın logunda görünür."
          echo "=========================================="
