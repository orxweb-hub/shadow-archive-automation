name: Shadow Archive - YouTube Private Upload

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python Kodunu Kontrol Et
        run: |
          echo "=========================================="
          echo "YOUTUBE PUBLISHER KOD KONTROLÜ"
          echo "=========================================="

          echo "COMMIT:"
          git rev-parse HEAD

          echo ""
          echo "DOSYA:"
          git status --short research/youtube/youtube_private_upload.py

          echo ""
          echo "YAYIN SAATLERİ:"
          grep -n -A5 "short_1_time" research/youtube/youtube_private_upload.py
          grep -n -A5 "main_time" research/youtube/youtube_private_upload.py
          grep -n -A5 "short_2_time" research/youtube/youtube_private_upload.py

          echo ""
          echo "BEKLENEN:"
          echo "Short #1  = 10:00 Türkiye"
          echo "Ana Video  = 13:00 Türkiye"
          echo "Short #2  = 21:00 Türkiye"
          echo "=========================================="

      - name: Find Latest Master Production Run
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow="Shadow Archive - Master Production" \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "Master Production successful run not found."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "LATEST MASTER PRODUCTION RUN"
          echo "=========================================="
          echo "Run ID: $RUN_ID"
          echo "=========================================="

      - name: Download Production Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p production_package

          gh run download \
            "${{ steps.find_run.outputs.run_id }}" \
            --name shadow-archive-complete-production \
            --dir production_package

          echo "=========================================="
          echo "PRODUCTION PACKAGE"
          echo "=========================================="

          find production_package \
            -type f \
            -exec ls -lh {} \;

          echo "=========================================="

      - name: Verify Production Files
        run: |
          echo "=========================================="
          echo "VERIFYING PRODUCTION FILES"
          echo "=========================================="

          test -f production_package/main/main_video.mp4
          test -f production_package/shorts/short_1.mp4
          test -f production_package/shorts/short_2.mp4
          test -f production_package/research/current_topic.json

          echo "✓ Main video found"
          echo "✓ Short #1 found"
          echo "✓ Short #2 found"
          echo "✓ Topic data found"

          echo ""
          echo "CURRENT TOPIC:"
          cat production_package/research/current_topic.json

          echo ""
          echo "=========================================="
          echo "ALL FILES VERIFIED"
          echo "=========================================="

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube Dependencies
        run: |
          pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Upload Videos To YouTube
        env:
          YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE — YOUTUBE PUBLISHER"
          echo "=========================================="

          python research/youtube/youtube_private_upload.py

          echo ""
          echo "=========================================="
          echo "YOUTUBE PUBLISHING PROCESS COMPLETE"
          echo "=========================================="
