name: Shadow Archive - YouTube Private Upload

on:
  workflow_dispatch:
    inputs:
      production_id:
        description: "Yayınlanacak Production ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Production ID kontrol
        id: production
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE — YOUTUBE PUBLISHER"
          echo "=========================================="

          PRODUCTION_ID="${{ inputs.production_id }}"

          echo "Production ID:"
          echo "$PRODUCTION_ID"

          if [ -z "$PRODUCTION_ID" ]; then
            echo ""
            echo "❌ PRODUCTION ID BOŞ."
            exit 1
          fi

          RUN_ID="${PRODUCTION_ID##*-}"

          echo ""
          echo "GitHub Production Run ID:"
          echo "$RUN_ID"

          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo ""
            echo "❌ GEÇERSİZ RUN ID."
            echo "Production ID: $PRODUCTION_ID"
            exit 1
          fi

          echo ""
          echo "production_id=$PRODUCTION_ID" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          echo "=========================================="

      - name: Python Kodunu Kontrol Et
        run: |
          echo "=========================================="
          echo "YOUTUBE PUBLISHER KONTROL"
          echo "=========================================="

          echo "COMMIT:"
          git rev-parse HEAD

          echo ""
          echo "YAYIN SAATLERİ:"
          grep -n -A5 "short_1_time" research/youtube/youtube_private_upload.py || true
          grep -n -A5 "main_time" research/youtube/youtube_private_upload.py || true
          grep -n -A5 "short_2_time" research/youtube/youtube_private_upload.py || true

          echo ""
          echo "BEKLENEN:"
          echo "Short #1  = 09:00 Türkiye"
          echo "Ana Video  = 12:00 Türkiye"
          echo "Short #2  = 21:00 Türkiye"

          echo "=========================================="

      - name: Production Run kontrol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=========================================="
          echo "PRODUCTION RUN KONTROL"
          echo "=========================================="

          RUN_ID="${{ steps.production.outputs.run_id }}"

          echo "Run ID:"
          echo "$RUN_ID"

          RUN_INFO=$(gh run view \
            "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --json databaseId,status,conclusion,name,createdAt)

          echo ""
          echo "RUN BİLGİSİ:"
          echo "$RUN_INFO"

          STATUS=$(echo "$RUN_INFO" | python -c '
          import json
          import sys
          data = json.load(sys.stdin)
          print(data.get("status", ""))
          ')

          CONCLUSION=$(echo "$RUN_INFO" | python -c '
          import json
          import sys
          data = json.load(sys.stdin)
          print(data.get("conclusion", ""))
          ')

          echo ""
          echo "STATUS: $STATUS"
          echo "CONCLUSION: $CONCLUSION"

          if [ "$STATUS" != "completed" ]; then
            echo ""
            echo "❌ PRODUCTION RUN HENÜZ TAMAMLANMAMIŞ."
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo ""
            echo "❌ PRODUCTION RUN BAŞARILI DEĞİL."
            exit 1
          fi

          echo ""
          echo "✅ DOĞRU PRODUCTION RUN BAŞARILI."

          echo "=========================================="

      - name: Production Package indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=========================================="
          echo "DOĞRU PRODUCTION PACKAGE İNDİRİLİYOR"
          echo "=========================================="

          RUN_ID="${{ steps.production.outputs.run_id }}"

          mkdir -p production_package

          gh run download \
            "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name shadow-archive-complete-production \
            --dir production_package

          echo ""
          echo "İNDİRİLEN DOSYALAR:"
          find production_package \
            -type f \
            -exec ls -lh {} \;

          echo "=========================================="

      - name: Production Package Kontrol
        run: |
          echo "=========================================="
          echo "PRODUCTION PACKAGE KONTROL"
          echo "=========================================="

          test -f production_package/main/main_video.mp4
          test -f production_package/shorts/short_1.mp4
          test -f production_package/shorts/short_2.mp4
          test -f production_package/research/current_topic.json
          test -f
