name: Shadow Archive - Shorts Final

on:
  workflow_dispatch:

jobs:
  shorts-final:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Shorts Voice
        run: |
          python research/research/shorts_tts.py

      - name: Generate Shorts Video
        run: |
          python research/research/shorts_editor.py

      - name: Generate English Subtitles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/research/shorts_subtitles.py

      - name: Burn English Subtitles
        run: |
          python research/research/shorts_caption_editor.py

      - name: Check Final Shorts
        run: |
          ls -lh research/video/shorts_final/

      - name: Upload Final Shorts
        uses: actions/upload-artifact@v4
        with:
          name: shadow-archive-shorts-final
          path: research/video/shorts_final/shadow_archive_short_*_final.mp4
          retention-days: 7
