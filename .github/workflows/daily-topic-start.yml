name: Shadow Archive - Daily Topic Start

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-topic:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate Daily Topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python research/research/daily_topic_generator.py

      - name: Save Current Topic To Repository
        run: |
          echo "=========================================="
          echo "SAVING CURRENT TOPIC"
          echo "=========================================="

          git config user.name "Shadow Archive Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/current_topic.json

          if git diff --cached --quiet; then
            echo "No topic changes detected."
          else
            git commit -m "Update daily Shadow Archive topic"
            git push
          fi

          echo "=========================================="
          echo "CURRENT TOPIC SAVED TO GITHUB"
          echo "=========================================="
