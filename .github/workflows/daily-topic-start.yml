name: Shadow Archive - Daily Topic Start

on:
  schedule:
    # Türkiye saatiyle 09:00
    # GitHub Actions UTC kullandığı için 06:00 UTC
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-topic:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate Daily Topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python research/research/daily_topic_generator.py
