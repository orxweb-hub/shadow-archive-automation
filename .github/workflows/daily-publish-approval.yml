name: Shadow Archive - Daily Publish Approval

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  approval:
    runs-on: ubuntu-latest

    steps:

      - name: Repository'i indir
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Bugünün doğru Master Production Run'ını bul
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE"
          echo "BUGÜNÜN PRODUCTION PAKETİ ARANIYOR"
          echo "=========================================="

          TODAY=$(TZ=Europe/Istanbul date +%Y-%m-%d)

          echo "Türkiye tarihi: $TODAY"
          echo ""

          RUN_ID=$(gh run list \
            --workflow="Shadow Archive - Master Production" \
            --status=success \
            --limit=20 \
            --json databaseId,createdAt \
            --jq ".[] | select(.createdAt | fromdateiso8601 >= (\"${TODAY}T00:00:00+03:00\" | fromdateiso8601)) | .databaseId" \
            | head -n 1)

          if [ -z "$RUN_ID" ]; then
            echo "❌ Bugünün başarılı Master Production run'ı bulunamadı."
            exit 1
          fi

          echo "✅ Master Production Run ID: $RUN_ID"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Bugünün Production Package'ını indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=========================================="
          echo "PRODUCTION PACKAGE İNDİRİLİYOR"
          echo "=========================================="

          mkdir -p production_package

          gh run download \
            "${{ steps.find_run.outputs.run_id }}" \
            --name shadow-archive-complete-production \
            --dir production_package

          echo ""
          echo "İNDİRİLEN DOSYALAR:"
          find production_package -type f -exec ls -lh {} \;

      - name: Production ID kontrol et
        id: production
        run: |
          echo "=========================================="
          echo "PRODUCTION ID K
