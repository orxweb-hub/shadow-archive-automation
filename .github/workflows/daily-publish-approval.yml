name: Shadow Archive - Daily Publish Approval

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval:
    runs-on: ubuntu-latest

    steps:
      - name: Telegram'a yayın onayı gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🤖 SHADOW ARCHIVE — GÜNLÜK YAYIN HAZIR

          🎬 Bugünün içerikleri hazır.

          📱 Short #1 → 10:00
          🎥 Ana Video → 13:00
          📱 Short #2 → 21:00

          Üç içerik de YouTube'a planlanacak.

          ▶️ Yayınlamak için aşağıdaki butona bas."

          KEYBOARD='{"inline_keyboard":[[{"text":"▶️ YAYINLA","callback_data":"publish_approve"},{"text":"❌ YAYINLAMA","callback_data":"publish_reject"}]]}'

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "reply_markup=${KEYBOARD}"

          echo "08:30 YAYIN ONAYI TELEGRAM'A GÖNDERİLDİ"
