name: Shadow Archive - Daily Publish Approval

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  approval:
    runs-on: ubuntu-latest

    steps:

      - name: Repository indir
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Bugunun Production Run bul
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE"
          echo "BUGUNUN PRODUCTION PAKETI ARANIYOR"
          echo "=========================================="

          TODAY=$(TZ=Europe/Istanbul date +%Y-%m-%d)

          echo "Turkiye tarihi: $TODAY"

          gh run list \
            --workflow="Shadow Archive - Master Production" \
            --status=success \
            --limit=20 \
            --json databaseId,createdAt \
            > master_runs.json

          python - "$TODAY" master_runs.json > selected_run.txt <<'PY'
          import json
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          today = sys.argv[1]
          filename = sys.argv[2]

          with open(filename, "r", encoding="utf-8") as f:
              runs = json.load(f)

          turkey = ZoneInfo("Europe/Istanbul")
          matching = []

          for run in runs:
              created_at = run.get("createdAt")
              database_id = run.get("databaseId")

              if not created_at or not database_id:
                  continue

              dt = datetime.fromisoformat(
                  created_at.replace("Z", "+00:00")
              )

              turkey_date = dt.astimezone(
                  turkey
              ).date().isoformat()

              if turkey_date == today:
                  matching.append(
                      (dt, str(database_id))
                  )

          matching.sort(
              key=lambda x: x[0],
              reverse=True
          )

          if matching:
              print(matching[0][1])
          PY

          RUN_ID=$(cat selected_run.txt)

          if [ -z "$RUN_ID" ]; then
            echo "BUGUNUN MASTER PRODUCTION RUN'I BULUNAMADI"
            exit 1
          fi

          echo "Master Production Run ID: $RUN_ID"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Production Package indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=========================================="
          echo "PRODUCTION PACKAGE INDIRILIYOR"
          echo "=========================================="

          mkdir -p production_package

          gh run download \
            "${{ steps.find_run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name shadow-archive-complete-production \
            --dir production_package

          echo ""
          echo "DOSYALAR:"
          find production_package \
            -type f \
            -exec ls -lh {} \;

      - name: Production ID kontrol
        id: production
        run: |
          echo "=========================================="
          echo "PRODUCTION ID KONTROL"
          echo "=========================================="

          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          metadata_file = "production_package/metadata/production.json"

          if not os.path.exists(metadata_file):
              print("production.json bulunamadi")
              sys.exit(1)

          with open(
              metadata_file,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          production_id = data["production_id"]
          production_date = data["production_date"]
          package_run_id = str(data["github_run_id"])

          today = datetime.now(
              ZoneInfo("Europe/Istanbul")
          ).date().isoformat()

          expected_run_id = "${{ steps.find_run.outputs.run_id }}"

          print("Production ID:", production_id)
          print("Production Date:", production_date)
          print("Package Run ID:", package_run_id)
          print("Today:", today)
          print("Expected Run ID:", expected_run_id)

          if production_date != today:
              print("Paket bugune ait degil")
              sys.exit(1)

          if package_run_id != expected_run_id:
              print("Run ID uyusmuyor")
              sys.exit(1)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as out:
              out.write(
                  "production_id="
                  + production_id
                  + "\n"
              )

              out.write(
                  "package_run_id="
                  + package_run_id
                  + "\n"
              )

          print("")
          print("PAKET BUGUNE AIT")
          print("RUN ID DOGRULANDI")
          PY

      - name: Video dosyalarini kontrol et
        run: |
          echo "=========================================="
          echo "VIDEO DOSYALARI KONTROL"
          echo "=========================================="

          test -f production_package/main/main_video.mp4
          test -f production_package/shorts/short_1.mp4
          test -f production_package/shorts/short_2.mp4
          test -f production_package/research/current_topic.json

          echo "Ana video bulundu"
          echo "Short 1 bulundu"
          echo "Short 2 bulundu"
          echo "current_topic bulundu"

      - name: Video bilgilerini oku
        id: topic
        run: |
          echo "=========================================="
          echo "BUGUNUN VIDEO BILGILERI"
          echo "=========================================="

          python - <<'PY'
          import json
          import os

          path = "production_package/research/current_topic.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          title = (
              data.get("title")
              or data.get("video_title")
              or data.get("youtube_title")
              or "Shadow Archive"
          )

          description = (
              data.get("description")
              or data.get("video_description")
              or data.get("youtube_description")
              or ""
          )

          hashtags = data.get("hashtags", [])

          if isinstance(hashtags, list):
              hashtags_text = " ".join(
                  str(x) for x in hashtags
              )
          else:
              hashtags_text = str(hashtags)

          output = os.environ["GITHUB_OUTPUT"]

          with open(
              output,
              "a",
              encoding="utf-8"
          ) as out:

              out.write("title<<EOF\n")
              out.write(title + "\n")
              out.write("EOF\n")

              out.write("description<<EOF\n")
              out.write(description + "\n")
              out.write("EOF\n")

              out.write("hashtags<<EOF\n")
              out.write(hashtags_text + "\n")
              out.write("EOF\n")

          print("BASLIK:")
          print(title)

          print("")
          print("ACIKLAMA:")
          print(description)

          print("")
          print("HASHTAGLER:")
          print(hashtags_text)
          PY

      - name: Telegram Onay Mesaji Gonder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_TITLE: ${{ steps.topic.outputs.title }}
          VIDEO_DESCRIPTION: ${{ steps.topic.outputs.description }}
          VIDEO_HASHTAGS: ${{ steps.topic.outputs.hashtags }}
          PRODUCTION_ID: ${{ steps.production.outputs.production_id }}
        run: |
          echo "=========================================="
          echo "TELEGRAM YAYIN ONAYI"
          echo "=========================================="

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          title = os.environ["VIDEO_TITLE"]
          description = os.environ["VIDEO_DESCRIPTION"]
          hashtags = os.environ["VIDEO_HASHTAGS"]
          production_id = os.environ["PRODUCTION_ID"]

          lines = [
              "🤖 SHADOW ARCHIVE — GÜNLÜK YAYIN HAZIR",
              "",
              "🎬 VİDEO BAŞLIĞI:",
              title,
              "",
              "📝 AÇIKLAMA:",
              description,
              "",
              hashtags,
              "",
              "🆔 Production ID:",
              production_id,
              "",
              "📱 Short #1 → 09:00",
              "🎥 Ana Video → 12:00",
              "📱 Short #2 → 21:00",
              "",
              "Üç içerik de YouTube'a planlanacak.",
              "",
              "▶️ Yayınlamak için aşağıdaki butona bas."
          ]

          message = "\n".join(lines)

          keyboard = {
              "inline_keyboard": [
                  [
                      {
                          "text": "▶️ YAYINLA",
                          "callback_data": "publish_approve:" + production_id
                      },
                      {
                          "text": "❌ YAYINLAMA",
                          "callback_data": "publish_reject:" + production_id
                      }
                  ]
              ]
          }

          payload = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": message,
                  "reply_markup": json.dumps(
                      keyboard,
                      ensure_ascii=False
                  )
              }
          ).encode("utf-8")

          url = (
              "https://api.telegram.org/bot"
              + token
              + "/sendMessage"
          )

          request = urllib.request.Request(
              url,
              data=payload,
              method="POST"
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:
              result = json.loads(
                  response.read().decode("utf-8")
              )

          print(result)

          if not result.get("ok"):
              print("TELEGRAM MESAJI GONDERILEMEDI")
              raise SystemExit(1)

          print("")
          print("TELEGRAM ONAY MESAJI GONDERILDI")
          print("==========================================")
          PY
