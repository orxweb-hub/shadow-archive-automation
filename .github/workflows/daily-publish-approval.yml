name: Shadow Archive - Daily Publish Approval

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  approval:
    runs-on: ubuntu-latest

    steps:

      - name: Repository'i indir
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Bugünün doğru Master Production Run'ını bul
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE"
          echo "BUGÜNÜN PRODUCTION PAKETİ ARANIYOR"
          echo "=========================================="

          TODAY=$(TZ=Europe/Istanbul date +%Y-%m-%d)

          echo "Türkiye tarihi:"
          echo "$TODAY"
          echo ""

          gh run list \
            --workflow="Shadow Archive - Master Production" \
            --status=success \
            --limit=20 \
            --json databaseId,createdAt \
            > master_runs.json

          echo "Master Production run'ları:"
          cat master_runs.json

          RUN_ID=$(python - "$TODAY" master_runs.json <<'PY'
          import json
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          today = sys.argv[1]
          filename = sys.argv[2]

          with open(filename, "r", encoding="utf-8") as f:
              runs = json.load(f)

          turkey = ZoneInfo("Europe/Istanbul")

          matching = []

          for run in runs:
              created_at = run.get("createdAt")
              database_id = run.get("databaseId")

              if not created_at or not database_id:
                  continue

              dt = datetime.fromisoformat(
                  created_at.replace("Z", "+00:00")
              )

              turkey_date = dt.astimezone(turkey).date().isoformat()

              if turkey_date == today:
                  matching.append(
                      (
                          dt,
                          str(database_id)
                      )
                  )

          matching.sort(
              key=lambda x: x[0],
              reverse=True
          )

          if matching:
              print(matching[0][1])
          PY
          )

          if [ -z "$RUN_ID" ]; then
            echo ""
            echo "❌ BUGÜNÜN BAŞARILI MASTER PRODUCTION RUN'I BULUNAMADI."
            echo ""
            echo "Türkiye tarihi:"
            echo "$TODAY"
            exit 1
          fi

          echo ""
          echo "✅ BUGÜNÜN MASTER PRODUCTION RUN'I BULUNDU"
          echo "Run ID: $RUN_ID"
          echo "=========================================="

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Bugünün Production Package'ını indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=========================================="
          echo "PRODUCTION PACKAGE İNDİRİLİYOR"
          echo "=========================================="

          mkdir -p production_package

          gh run download \
            "${{ steps.find_run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name shadow-archive-complete-production \
            --dir production_package

          echo ""
          echo "İNDİRİLEN DOSYALAR:"
          find production_package \
            -type f \
            -exec ls -lh {} \;

          echo "=========================================="

      - name: Production ID kontrol et
        id: production
        run: |
          echo "=========================================="
          echo "PRODUCTION ID KONTROL"
          echo "=========================================="

          METADATA="production_package/metadata/production.json"

          if [ ! -f "$METADATA" ]; then
            echo "❌ production.json bulunamadı."
            exit 1
          fi

          echo "METADATA:"
          cat "$METADATA"

          PRODUCTION_ID=$(python -c '
          import json
          with open(
              "production_package/metadata/production.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)
          print(data["production_id"])
          ')

          PRODUCTION_DATE=$(python -c '
          import json
          with open(
              "production_package/metadata/production.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)
          print(data["production_date"])
          ')

          PACKAGE_RUN_ID=$(python -c '
          import json
          with open(
              "production_package/metadata/production.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)
          print(data["github_run_id"])
          ')

          TODAY=$(TZ=Europe/Istanbul date +%Y-%m-%d)

          echo ""
          echo "Production ID:"
          echo "$PRODUCTION_ID"

          echo ""
          echo "Production Date:"
          echo "$PRODUCTION_DATE"

          echo ""
          echo "Package Run ID:"
          echo "$PACKAGE_RUN_ID"

          echo ""
          echo "Today's Date:"
          echo "$TODAY"

          if [ "$PRODUCTION_DATE" != "$TODAY" ]; then
            echo ""
            echo "❌ BU PAKET BUGÜNE AİT DEĞİL."
            echo "Beklenen: $TODAY"
            echo "Bulunan: $PRODUCTION_DATE"
            exit 1
          fi

          if [ "$PACKAGE_RUN_ID" != "${{ steps.find_run.outputs.run_id }}" ]; then
            echo ""
            echo "❌ RUN ID UYUŞMUYOR."
            echo ""
            echo "Bulunan Run:"
            echo "${{ steps.find_run.outputs.run_id }}"
            echo ""
            echo "Paket Run:"
            echo "$PACKAGE_RUN_ID"
            exit 1
          fi

          echo ""
          echo "✅ PAKET BUGÜNE AİT"
          echo "✅ RUN ID DOĞRULANDI"

          echo "production_id=$PRODUCTION_ID" >> "$GITHUB_OUTPUT"
          echo "package_run_id=$PACKAGE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Video dosyalarını kontrol et
        run: |
          echo "=========================================="
          echo "VIDEO DOSYALARI KONTROL"
          echo "=========================================="

          test -f production_package/main/main_video.mp4
          test -f production_package/shorts/short_1.mp4
          test -f production_package/shorts/short_2.mp4
          test -f production_package/research/current_topic.json

          echo "✅ Ana video bulundu"
          echo "✅ Short #1 bulundu"
          echo "✅ Short #2 bulundu"
          echo "✅ current_topic.json bulundu"

          echo "=========================================="

      - name: Video bilgilerini oku
        id: topic
        run: |
          echo "=========================================="
          echo "BUGÜNÜN VIDEO BİLGİLERİ"
          echo "=========================================="

          python - <<'PY'
          import json
          import os

          path = "production_package/research/current_topic.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          title = (
              data.get("title")
              or data.get("video_title")
              or data.get("youtube_title")
              or "Shadow Archive"
          )

          description = (
              data.get("description")
              or data.get("video_description")
              or data.get("youtube_description")
              or ""
          )

          hashtags = data.get("hashtags", [])

          if isinstance(hashtags, list):
              hashtags_text = " ".join(
                  str(x) for x in hashtags
              )
          else:
              hashtags_text = str(hashtags)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as out:

              out.write("title<<EOF\n")
              out.write(title + "\n")
              out.write("EOF\n")

              out.write("description<<EOF\n")
              out.write(description + "\n")
              out.write("EOF\n")

              out.write("hashtags<<EOF\n")
              out.write(hashtags_text + "\n")
              out.write("EOF\n")

          print("")
          print("BAŞLIK:")
          print(title)

          print("")
          print("AÇIKLAMA:")
          print(description)

          print("")
          print("HASHTAGLER:")
          print(hashtags_text)
          PY

      - name: Telegram'a yayın onayı gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_TITLE: ${{ steps.topic.outputs.title }}
          VIDEO_DESCRIPTION: ${{ steps.topic.outputs.description }}
          VIDEO_HASHTAGS: ${{ steps.topic.outputs.hashtags }}
          PRODUCTION_ID: ${{ steps.production.outputs.production_id }}
          PRODUCTION_RUN_ID: ${{ steps.production.outputs.package_run_id }}
        run: |
          echo "=========================================="
          echo "TELEGRAM YAYIN ONAYI"
          echo "=========================================="

          MESSAGE="🤖 SHADOW ARCHIVE — GÜNLÜK YAYIN HAZIR

🎬 VİDEO BAŞLIĞI:
${VIDEO_TITLE}

📝 AÇIKLAMA:
${VIDEO_DESCRIPTION}

${VIDEO_HASHTAGS}

🆔 Production ID:
${PRODUCTION_ID}

📱 Short #1 → 09:00
🎥 Ana Video → 12:00
📱 Short #2 → 21:00

Üç içerik de YouTube'a planlanacak.

▶️ Yayınlamak için aşağıdaki butona bas."

          KEYBOARD=$(python - <<'PY'
          import json
          import os

          production_id = os.environ["PRODUCTION_ID"]

          keyboard = {
              "inline_keyboard": [
                  [
                      {
                          "text": "▶️ YAYINLA",
                          "callback_data": (
                              f"publish_approve:{production_id}"
                          )
                      },
                      {
                          "text": "❌ YAYINLAMA",
                          "callback_data": (
                              f"publish_reject:{production_id}"
                          )
                      }
                  ]
              ]
          }

          print(
              json.dumps(
                  keyboard,
                  ensure_ascii=False
              )
          )
          PY
          )

          RESPONSE=$(curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "reply_markup=${KEYBOARD}")

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo ""
            echo "✅ TELEGRAM ONAY MESAJI GÖNDERİLDİ"
          else
            echo ""
            echo "❌ TELEGRAM MESAJI GÖNDERİLEMEDİ"
            exit 1
          fi

          echo "=========================================="
