name: Shadow Archive - Cinematic Main Video V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cinematic-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Natural V3 Voice
        run: |
          python research/research/tts_generator.py

      - name: Generate Mystery Music
        run: |
          python research/research/mystery_music.py

      - name: Check Existing Subtitles
        run: |
          test -f research/video/subtitles/mv_joyita_english.srt
          echo "Existing subtitles found."

      - name: Check Existing Visual Assets
        run: |
          test -d research/video/clips
          find research/video/clips -type f -name "*.mp4" | head -20
          echo "Existing visual assets found."

      - name: Build Cinematic V3
        run: |
          python research/research/cinematic_video_editor.py

      - name: Check Final Video
        run: |
          ls -lh research/video/shadow_archive_mv_joyita_v3.mp4
          du -h research/video/shadow_archive_mv_joyita_v3.mp4

      - name: Upload Cinematic V3
        uses: actions/upload-artifact@v4
        with:
          name: shadow-archive-main-cinematic-v3
          path: research/video/shadow_archive_mv_joyita_v3.mp4
          retention-days: 7
