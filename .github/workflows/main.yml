name: Shadow Archive - Topic Finder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find-topics:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'i indir
        uses: actions/checkout@v4

      - name: Python'u kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereksinimleri kur
        run: pip install -r requirements.txt

      - name: 10 konu üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python research/research/daily_topic_generator.py

      - name: Güncel konuyu GitHub'a kaydet
        run: |
          git config user.name "Shadow Archive Bot"
          git config user.email "actions@github.com"

          git add research/current_topic.json

          if git diff --cached --quiet; then
            echo "current_topic.json değişmedi."
          else
            git commit -m "Update Shadow Archive current topic"
            git push
          fi

      - name: Güncel konuyu kontrol et
        run: |
          echo "=========================================="
          echo "CURRENT TOPIC"
          echo "=========================================="
          cat research/current_topic.json
