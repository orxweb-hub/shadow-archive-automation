name: Shadow Archive - English Subtitles V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  subtitles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Translation Dependencies
        run: |
          pip install openai-whisper
          pip install torch
          pip install transformers
          pip install sentencepiece

      - name: Check Voice
        run: |
          ls -lh research/audio/mv_joyita_voice.wav

      - name: Generate English Subtitles
        run: |
          python research/research/english_subtitle_generator.py

      - name: Check Subtitle
        run: |
          echo "=========================================="
          echo "FIRST SUBTITLE LINES"
          echo "=========================================="
          head -100 research/video/subtitles/mv_joyita_english.srt

      - name: Save Subtitle To Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/video/subtitles/mv_joyita_english.srt

          if git diff --cached --quiet; then
            echo "No subtitle changes to commit."
          else
            git commit -m "Add English subtitles for MV Joyita"
            git push
          fi

      - name: Upload English Subtitle
        uses: actions/upload-artifact@v4
        with:
          name: shadow-archive-english-subtitles-v2
          path: research/video/subtitles/mv_joyita_english.srt
          retention-days: 7
