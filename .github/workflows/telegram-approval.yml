name: Telegram Approval Test

on: workflow_dispatch

jobs:
  approval:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram Approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=SHADOW ARCHIVE - YAYIN ONAYI

MV JOYITA

ANA VIDEO: HAZIR
SHORT 1: HAZIR
SHORT 2: HAZIR
THUMBNAIL: HAZIR
BASLIK: HAZIR
ACIKLAMA: HAZIR
ETIKETLER: HAZIR

YAYIN PLANI

09:00 - SHORT 1
12:00 - ANA VIDEO
21:00 - SHORT 2

Bu icerikleri planlanan saatlerde yayinlamak icin onay bekleniyor."
