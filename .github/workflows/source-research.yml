name: Shadow Archive - Source Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'i indir
        uses: actions/checkout@v4

      - name: Python'u kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereksinimleri kur
        run: pip install -r requirements.txt

      - name: Kaynak araştırmasını çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python research/source_researcher.py
