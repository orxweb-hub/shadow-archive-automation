name: Shadow Archive - Topic Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-topic:
    runs-on: ubuntu-latest

    steps:

      - name: Repository'i indir
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gemini kurulumu
        run: |
          pip install google-genai

      - name: Eski konuyu göster
        run: |
          echo "=========================================="
          echo "ESKİ CURRENT TOPIC"
          echo "=========================================="

          if [ -f research/current_topic.json ]; then
            cat research/current_topic.json
          else
            echo "current_topic.json bulunamadı."
          fi

          echo ""
          echo "=========================================="

      - name: YENİ KONU ÜRET
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE — YENİ KONU TESTİ"
          echo "=========================================="

          python research/research/daily_topic_generator.py

          echo ""
          echo "=========================================="
          echo "YENİ CURRENT TOPIC"
          echo "=========================================="

          cat research/current_topic.json

          echo ""
          echo "=========================================="

      - name: Telegram fonksiyonunun çalışmasını engelle
        run: |
          echo "=========================================="
          echo "TELEGRAM TESTİ DEVRE DIŞI"
          echo "=========================================="
          echo "Konu üretimi başarılı."
          echo "Bu test Telegram mesajı göndermeyecek."
          echo "=========================================="

      - name: Konuyu doğrula
        run: |
          python - <<'PY'
          import json

          with open(
              "research/current_topic.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          topic = data.get("topic", "").strip()
          title = data.get("title", "").strip()
          description = data.get("description", "").strip()

          print("==========================================")
          print("YENİ KONU KONTROLÜ")
          print("==========================================")

          print("")
          print("KONU:")
          print(topic)

          print("")
          print("BAŞLIK:")
          print(title)

          print("")
          print("AÇIKLAMA:")
          print(description)

          if not topic:
              raise SystemExit("❌ KONU BOŞ.")

          if not title:
              raise SystemExit("❌ BAŞLIK BOŞ.")

          if not description:
              raise SystemExit("❌ AÇIKLAMA BOŞ.")

          print("")
          print("✅ KONU DOLU")
          print("✅ BAŞLIK DOLU")
          print("✅ AÇIKLAMA DOLU")
          print("==========================================")

      - name: Yeni konuyu GitHub'a kaydet
        run: |
          echo "=========================================="
          echo "YENİ KONU GITHUB'A KAYDEDİLİYOR"
          echo "=========================================="

          git config user.name "Shadow Archive Bot"
          git config user.email "shadow-archive-bot@users.noreply.github.com"

          git add research/current_topic.json
          git add research/topic_history.json

          if git diff --cached --quiet; then
            echo "Değişiklik bulunamadı."
            exit 1
          fi

          git commit -m "Update Shadow Archive daily topic"
          git push origin main

          echo ""
          echo "✅ YENİ KONU GITHUB'A KAYDEDİLDİ."
          echo "=========================================="
