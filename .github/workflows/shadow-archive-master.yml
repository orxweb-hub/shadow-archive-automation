name: Shadow Archive - Master Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 — CHECKOUT
      # ============================================================
      - name: Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2 — FFMPEG
      # ============================================================
      - name: Install FFmpeg
        run: |
          echo "=========================================="
          echo "FFMPEG KURULUYOR"
          echo "=========================================="

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo ""
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

          echo ""
          echo "✅ FFMPEG HAZIR"
          echo "=========================================="


      # ============================================================
      # 3 — PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 4 — DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          echo "=========================================="
          echo "DEPENDENCIES"
          echo "=========================================="

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install google-genai

          echo ""
          echo "=========================================="
          echo "✅ DEPENDENCIES HAZIR"
          echo "=========================================="


      # ============================================================
      # 5 — DOSYA KONTROLÜ
      # ============================================================
      - name: Check Required Files
        run: |
          echo "=========================================="
          echo "GEREKLI DOSYA KONTROLU"
          echo "=========================================="

          required_files=(
            "research/research/daily_topic_generator.py"
            "research/research/web_researcher.py"
            "research/research/script_generator.py"
            "research/research/tts_generator.py"
            "research/research/visual_research.py"
            "research/research/cinematic_video_editor.py"
            "research/research/english_subtitle_generator.py"
            "research/research/shorts_selector.py"
            "research/research/shorts_tts.py"
            "research/research/shorts_subtitles.py"
            "research/research/shorts_editor.py"
            "research/research/shorts_caption_editor.py"
            "research/research/shorts_branding.py"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ EKSİK: $file"
              exit 1
            fi

            echo "✅ $file"
          done

          echo ""
          echo "✅ TÜM GEREKLİ DOSYALAR MEVCUT"
          echo "=========================================="


      # ============================================================
      # 6 — YENİ KONU
      # ============================================================
      - name: Generate NEW Topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE — YENİ KONU"
          echo "=========================================="

          python research/research/daily_topic_generator.py

          echo ""
          echo "CURRENT TOPIC:"
          cat research/current_topic.json


      # ============================================================
      # 7 — KONU KONTROLÜ
      # ============================================================
      - name: Topic Validation
        run: |
          echo "=========================================="
          echo "KONU KONTROLÜ"
          echo "=========================================="

          if [ ! -f "research/current_topic.json" ]; then
            echo "❌ current_topic.json bulunamadı."
            exit 1
          fi

          python - <<'PY'
          import json

          path = "research/current_topic.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          topic = data.get("topic", "").strip()
          title = data.get("title", "").strip()

          if not topic:
              raise SystemExit("❌ topic boş.")

          if not title:
              raise SystemExit("❌ title boş.")

          print("✅ TOPIC:", topic)
          print("✅ TITLE:", title)
          PY

          echo "=========================================="


      # ============================================================
      # 8 — WEB RESEARCH
      # ============================================================
      - name: Web Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE WEB RESEARCH"
          echo "=========================================="

          python research/research/web_researcher.py

          echo ""
          echo "✅ WEB RESEARCH TAMAMLANDI"
          echo "=========================================="


      # ============================================================
      # 9 — SCRIPT
      # ============================================================
      - name: Script Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE SCRIPT"
          echo "=========================================="

          python research/research/script_generator.py

          echo ""
          echo "✅ SENARYO TAMAMLANDI"
          echo "=========================================="


      # ============================================================
      # 10 — TTS
      # ============================================================
      - name: Text To Speech
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE TTS"
          echo "=========================================="

          ffmpeg -version | head -n 1

          python research/research/tts_generator.py

          echo ""
          echo "✅ TTS TAMAMLANDI"
          echo "=========================================="


      # ============================================================
      # 11 — VISUAL RESEARCH
      # ============================================================
      - name: Visual Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE VISUAL RESEARCH"
          echo "=========================================="

          if [ -z "$PEXELS_API_KEY" ]; then
            echo "❌ PEXELS_API_KEY bulunamadı."
            exit 1
          fi

          python research/research/visual_research.py

          echo ""
          echo "✅ GÖRSEL RESEARCH TAMAMLANDI"
          echo "=========================================="


      # ============================================================
      # 12 — ANA VIDEO
      # ============================================================
      - name: Main Video Editor
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE MAIN VIDEO"
          echo "=========================================="

          python research/research/cinematic_video_editor.py

          echo ""
          echo "✅ ANA VIDEO TAMAMLANDI"
          echo "=========================================="


      # ============================================================
      # 13 — İNGİLİZCE ALTYAZI OLUŞTUR
      # ============================================================
      - name: English Subtitles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "ENGLISH SUBTITLES"
          echo "=========================================="

          python research/research/english_subtitle_generator.py

          echo ""
          echo "=========================================="
          echo "OLUŞAN SRT DOSYALARI"
          echo "=========================================="

          find research/video/subtitles \
            -type f \
            -name "*.srt" \
            -exec ls -lh {} \;

          echo ""
          echo "✅ İNGİLİZCE ALTYAZI OLUŞTURULDU"
          echo "=========================================="


      # ============================================================
      # 14 — ALTYAZIYI ANA VİDEOYA GÖM
      # ============================================================
      - name: Burn Subtitles Into Main Video
        run: |
          echo "=========================================="
          echo "ALTYAZI VIDEONUN ICINE GOMULUYOR"
          echo "=========================================="

          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          topic_file = Path(
              "research/current_topic.json"
          )

          with open(
              topic_file,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          topic = data.get("topic", "").strip()

          safe_name = topic.lower()

          safe_name = re.sub(
              r"[^a-z0-9]+",
              "_",
              safe_name
          )

          safe_name = safe_name.strip("_")

          if not safe_name:
              safe_name = "daily_topic"

          safe_name = safe_name[:80]

          video = Path(
              f"research/video/{safe_name}_v4.mp4"
          )

          subtitle = Path(
              f"research/video/subtitles/{safe_name}_english.srt"
          )

          temp_video = Path(
              f"research/video/{safe_name}_subtitle_temp.mp4"
          )

          print("")
          print("TOPIC:")
          print(topic)

          print("")
          print("VIDEO:")
          print(video)

          print("")
          print("SUBTITLE:")
          print(subtitle)

          if not video.exists():
              raise SystemExit(
                  f"❌ Ana video bulunamadı: {video}"
              )

          if not subtitle.exists():
              print("")
              print("SUBTITLE KLASÖRÜ:")
              subtitle.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              for file in subtitle.parent.glob("*"):
                  print("-", file)

              raise SystemExit(
                  f"❌ SRT bulunamadı: {subtitle}"
              )

          if subtitle.stat().st_size < 20:
              raise SystemExit(
                  "❌ SRT dosyası boş veya bozuk."
              )

          print("")
          print("✅ VIDEO BULUNDU")
          print("✅ SRT BULUNDU")

          command = [
              "ffmpeg",
              "-y",
              "-i",
              str(video),
              "-vf",
              f"subtitles={subtitle}",
              "-c:a",
              "copy",
              "-c:v",
              "libx264",
              "-preset",
              "veryfast",
              "-crf",
              "20",
              "-pix_fmt",
              "yuv420p",
              str(temp_video)
          ]

          print("")
          print("FFMPEG ALTYAZI ISLEMI:")
          print(" ".join(command))

          result = subprocess.run(
              command,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True
          )

          print(result.stdout)

          if result.returncode != 0:
              raise SystemExit(
                  "❌ Altyazı videoya gömülemedi."
              )

          if not temp_video.exists():
              raise SystemExit(
                  "❌ Altyazılı video oluşturulamadı."
              )

          if temp_video.stat().st_size < 100000:
              raise SystemExit(
                  "❌ Oluşan video dosyası çok küçük."
              )

          temp_video.replace(video)

          print("")
          print("==========================================")
          print("✅ ALTYAZI VIDEONUN ICINE GOMULDU")
          print("==========================================")
          print("")
          print("FINAL VIDEO:")
          print(video)
          print("")
          print(
              f"SIZE: {video.stat().st_size / 1024 / 1024:.2f} MB"
          )
          PY


      # ============================================================
      # 15 — SHORTS SELECTOR
      # ============================================================
      - name: Shorts Selector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHORTS SELECTOR"
          echo "=========================================="

          python research/research/shorts_selector.py

          echo ""
          echo "✅ SHORTS SEÇİMİ TAMAMLANDI"
          echo "=========================================="


      # ============================================================
      # 16 — SHORTS TTS
      # ============================================================
      - name: Shorts TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHORTS TTS"
          echo "=========================================="

          python research/research/shorts_tts.py

          echo ""
          echo "✅ SHORTS TTS TAMAMLANDI"
          echo "=========================================="


      # ============================================================
      # 17 — SHORTS SUBTITLES
      # ============================================================
      - name: Shorts Subtitles
        run: |
          echo "=========================================="
          echo "SHORTS SUBTITLES"
          echo "=========================================="

          python research/research/shorts_subtitles.py

          echo ""
          echo "✅ SHORTS ALTYAZILARI TAMAMLANDI"
          echo "=========================================="


      # ============================================================
      # 18 — SHORTS VIDEO
      # ============================================================
      - name: Shorts Video Editor
        run: |
          echo "=========================================="
          echo "SHORTS VIDEO EDITOR"
          echo "=========================================="

          python research/research/shorts_editor.py

          echo ""
          echo "✅ SHORTS VIDEOLARI TAMAMLANDI"
          echo "=========================================="


      # ============================================================
      # 19 — SHORTS CAPTIONS
      # ============================================================
      - name: Shorts Caption Editor
        run: |
          echo "=========================================="
          echo "SHORTS CAPTION EDITOR"
          echo "=========================================="

          python research/research/shorts_caption_editor.py

          echo ""
          echo "✅ SHORTS CAPTION TAMAMLANDI"
          echo "=========================================="


      # ============================================================
      # 20 — SHORTS BRANDING
      # ============================================================
      - name: Shorts Branding
        run: |
          echo "=========================================="
          echo "SHORTS BRANDING"
          echo "=========================================="

          python research/research/shorts_branding.py

          echo ""
          echo "✅ SHORTS BRANDING TAMAMLANDI"
          echo "=========================================="


      # ============================================================
      # 21 — ANA VIDEO VE SHORTS DOSYALARINI BUL
      # ============================================================
      - name: Production File Validation
        run: |
          echo "=========================================="
          echo "PRODUCTION DOSYA KONTROLU"
          echo "=========================================="

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          topic_file = Path(
              "research/current_topic.json"
          )

          if not topic_file.exists():
              raise SystemExit(
                  "❌ current_topic.json bulunamadı."
              )

          data = json.loads(
              topic_file.read_text(
                  encoding="utf-8"
              )
          )

          topic = data.get(
              "topic",
              ""
          ).strip()

          if not topic:
              raise SystemExit(
                  "❌ topic boş."
              )

          safe_name = topic.lower()

          safe_name = re.sub(
              r"[^a-z0-9]+",
              "_",
              safe_name
          )

          safe_name = safe_name.strip("_")

          if not safe_name:
              safe_name = "daily_topic"

          safe_name = safe_name[:80]

          main_video = Path(
              f"research/video/{safe_name}_v4.mp4"
          )

          short_1 = Path(
              f"research/video/shorts/{safe_name}_short_1.mp4"
          )

          short_2 = Path(
              f"research/video/shorts/{safe_name}_short_2.mp4"
          )

          subtitle = Path(
              f"research/video/subtitles/{safe_name}_english.srt"
          )

          print("")
          print("TOPIC:")
          print(topic)

          print("")
          print("SAFE NAME:")
          print(safe_name)

          print("")
          print("MAIN VIDEO:")
          print(main_video)

          print("")
          print("SUBTITLE:")
          print(subtitle)

          print("")
          print("SHORT 1:")
          print(short_1)

          print("")
          print("SHORT 2:")
          print(short_2)

          missing = []

          for file in [
              main_video,
              short_1,
              short_2,
              subtitle
          ]:
              if not file.exists():
                  missing.append(
                      str(file)
                  )

          if missing:
              print("")
              print("❌ EKSİK DOSYALAR:")

              for file in missing:
                  print("-", file)

              print("")
              print("MEVCUT DOSYALAR:")

              for file in Path(
                  "research"
              ).rglob("*"):
                  if file.is_file():
                      print("-", file)

              raise SystemExit(
                  "❌ Production dosyaları eksik."
              )

          for file in [
              main_video,
              short_1,
              short_2
          ]:

              size_mb = (
                  file.stat().st_size
                  / 1024
                  / 1024
              )

              if size_mb < 0.1:
                  raise SystemExit(
                      f"❌ Dosya çok küçük: {file}"
                  )

              print(
                  f"✅ {file} — {size_mb:.2f} MB"
              )

          print("")
          print(
              f"✅ SRT — {subtitle.stat().st_size} bytes"
          )

          print("")
          print("==========================================")
          print("✅ TÜM ÜRETİM DOSYALARI BULUNDU")
          print("==========================================")
          PY


      # ============================================================
      # 22 — PRODUCTION PACKAGE
      # ============================================================
      - name: Production Package Hazırla
        run: |
          echo "=========================================="
          echo "PRODUCTION PACKAGE"
          echo "=========================================="

          rm -rf production_package

          mkdir -p production_package/main
          mkdir -p production_package/shorts
          mkdir -p production_package/research

          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          topic_file = Path(
              "research/current_topic.json"
          )

          data = json.loads(
              topic_file.read_text(
                  encoding="utf-8"
              )
          )

          topic = data["topic"]

          safe_name = topic.lower()

          safe_name = re.sub(
              r"[^a-z0-9]+",
              "_",
              safe_name
          )

          safe_name = safe_name.strip("_")

          if not safe_name:
              safe_name = "daily_topic"

          safe_name = safe_name[:80]

          main_video = Path(
              f"research/video/{safe_name}_v4.mp4"
          )

          short_1 = Path(
              f"research/video/shorts/{safe_name}_short_1.mp4"
          )

          short_2 = Path(
              f"research/video/shorts/{safe_name}_short_2.mp4"
          )

          subtitle = Path(
              f"research/video/subtitles/{safe_name}_english.srt"
          )

          required = [
              main_video,
              short_1,
              short_2,
              subtitle,
              topic_file
          ]

          for file in required:
              if not file.exists():
                  raise SystemExit(
                      f"❌ Eksik dosya: {file}"
                  )

          shutil.copy2(
              main_video,
              "production_package/main/main_video.mp4"
          )

          shutil.copy2(
              short_1,
              "production_package/shorts/short_1.mp4"
          )

          shutil.copy2(
              short_2,
              "production_package/shorts/short_2.mp4"
          )

          shutil.copy2(
              topic_file,
              "production_package/research/current_topic.json"
          )

          shutil.copy2(
              subtitle,
              "production_package/research/main_english.srt"
          )

          history_file = Path(
              "research/topic_history.json"
          )

          if history_file.exists():
              shutil.copy2(
                  history_file,
                  "production_package/research/topic_history.json"
              )

          production_date = datetime.now(
              ZoneInfo("Europe/Istanbul")
          ).strftime("%Y-%m-%d")

          run_id = "${{ github.run_id }}"

          production_id = (
              f"{production_date}-{run_id}"
          )

          metadata = {
              "production_id": production_id,
              "production_date": production_date,
              "run_id": run_id,
              "topic": data.get("topic", ""),
              "title": data.get("title", ""),
              "description": data.get("description", ""),
              "hashtags": data.get("hashtags", [])
          }

          Path(
              "production_package/production.json"
          ).write_text(
              json.dumps(
                  metadata,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("")
          print("==========================================")
          print("PACKAGE HAZIR")
          print("==========================================")

          print(
              json.dumps(
                  metadata,
                  ensure_ascii=False,
                  indent=2
              )
          )

          print("")
          print("PRODUCTION ID:")
          print(production_id)
          PY

          echo ""
          echo "PACKAGE DOSYALARI:"

          find production_package \
            -type f \
            -exec ls -lh {} \;


      # ============================================================
      # 23 — PACKAGE VALIDATION
      # ============================================================
      - name: Production Package Validation
        run: |
          echo "=========================================="
          echo "PACKAGE VALIDATION"
          echo "=========================================="

          test -f \
            production_package/main/main_video.mp4

          test -f \
            production_package/shorts/short_1.mp4

          test -f \
            production_package/shorts/short_2.mp4

          test -f \
            production_package/research/current_topic.json

          test -f \
            production_package/research/main_english.srt

          test -f \
            production_package/production.json

          echo "✅ ANA VIDEO"
          echo "✅ SHORT 1"
          echo "✅ SHORT 2"
          echo "✅ CURRENT TOPIC"
          echo "✅ MAIN ENGLISH SRT"
          echo "✅ PRODUCTION JSON"

          python - <<'PY'
          import json

          with open(
              "production_package/production.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          required = [
              "production_id",
              "production_date",
              "run_id",
              "topic",
              "title",
              "description"
          ]

          for key in required:
              if not data.get(key):
                  raise SystemExit(
                      f"❌ production.json eksik alan: {key}"
                  )

          print("")
          print("PRODUCTION ID:")
          print(data["production_id"])

          print("")
          print("TOPIC:")
          print(data["topic"])

          print("")
          print("TITLE:")
          print(data["title"])

          print("")
          print("DESCRIPTION HAZIR")

          print("")
          print("HASHTAGS:")
          print(
              data.get(
                  "hashtags",
                  []
              )
          )

          print("")
          print("==========================================")
          print("✅ PRODUCTION JSON GEÇERLİ")
          print("==========================================")
          PY


      # ============================================================
      # 24 — FINAL FFPROBE CHECK
      # ============================================================
      - name: Final FFprobe Check
        run: |
          echo "=========================================="
          echo "FINAL VIDEO CHECK"
          echo "=========================================="

          echo ""
          echo "ANA VIDEO:"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            production_package/main/main_video.mp4

          echo ""
          echo "SHORT 1:"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            production_package/shorts/short_1.mp4

          echo ""
          echo "SHORT 2:"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            production_package/shorts/short_2.mp4

          echo ""
          echo "=========================================="
          echo "SRT:"
          echo "=========================================="

          wc -l \
            production_package/research/main_english.srt

          echo ""
          echo "=========================================="
          echo "✅ TÜM VİDEOLAR OKUNABİLİYOR"
          echo "=========================================="


      # ============================================================
      # 25 — ARTIFACT
      # ============================================================
      - name: Upload Complete Production
        uses: actions/upload-artifact@v4
        with:
          name: shadow-archive-complete-production
          path: production_package
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 26 — TOPIC HISTORY
      # ============================================================
      - name: Save Topic History
        run: |
          echo "=========================================="
          echo "TOPIC HISTORY KAYDEDİLİYOR"
          echo "=========================================="

          git config user.name \
            "Shadow Archive Bot"

          git config user.email \
            "shadow-archive-bot@users.noreply.github.com"

          git add research/current_topic.json
          git add research/topic_history.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit \
              -m "Shadow Archive new production topic"

            git push
          fi


      # ============================================================
      # 27 — TAMAMLANDI
      # ============================================================
      - name: Production Complete
        run: |
          echo ""
          echo "=========================================="
          echo "SHADOW ARCHIVE PRODUCTION TAMAMLANDI"
          echo "=========================================="

          echo "✅ FFmpeg"
          echo "✅ Yeni konu"
          echo "✅ Web research"
          echo "✅ Senaryo"
          echo "✅ TTS"
          echo "✅ Görseller"
          echo "✅ Ana video"
          echo "✅ İngilizce altyazı"
          echo "✅ ALTYAZI VIDEONUN ICINE GOMULDU"
          echo "✅ Short 1"
          echo "✅ Short 2"
          echo "✅ Production package"
          echo "✅ Video validation"
          echo "✅ Artifact"
