```yaml
name: Shadow Archive - Master Production

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  master:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Web Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/research/web_research.py

      - name: Generate Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/research/script_generator.py

      - name: Generate Natural Voice
        run: |
          python research/research/tts_generator.py

      - name: Check Production Files
        run: |
          echo "=========================================="
          echo "MASTER FIRST STAGE COMPLETE"
          echo "=========================================="

          echo "Research:"
          ls -lh research/reports/

          echo "Script:"
          ls -lh research/scripts/

          echo "Voice:"
          ls -lh research/audio/

          echo "=========================================="
```
