name: Shadow Archive - Master Production

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Web Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/research/web_researcher.py

      - name: Generate Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/research/script_generator.py

      - name: Generate Natural Voice
        run: |
          python research/research/tts_generator.py

      - name: Visual Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python research/research/visual_research.py

      - name: Generate Cinematic Main Video
        run: |
          python research/research/cinematic_video_editor.py

      - name: Check Main Video
        run: |
          echo "=========================================="
          echo "MAIN VIDEO GENERATED"
          echo "=========================================="

          ls -lh research/video/shadow_archive_mv_joyita_v4.mp4

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            research/video/shadow_archive_mv_joyita_v4.mp4

          echo "=========================================="

      - name: Upload Main Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-archive-master-video
          path: research/video/shadow_archive_mv_joyita_v4.mp4
          retention-days: 7

      - name: Send Publish Approval To Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = """🤖 SHADOW ARCHIVE

🎬 VİDEO HAZIR

✅ Araştırma tamamlandı
✅ Senaryo tamamlandı
✅ Seslendirme tamamlandı
✅ Görseller tamamlandı
✅ Ana video oluşturuldu

Video YouTube'a yüklenmeye hazır.

Yayınlansın mı?"""

          keyboard = {
              "inline_keyboard": [
                  [
                      {
                          "text": "▶️ YAYINLA",
                          "callback_data": "publish_approve"
                      },
                      {
                          "text": "❌ YAYINLAMA",
                          "callback_data": "publish_reject"
                      }
                  ]
              ]
          }

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "reply_markup": json.dumps(keyboard)
          }).encode()

          request = urllib.request.Request(
              url,
              data=data,
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode())

          print("==========================================")
          print("TELEGRAM PUBLISH APPROVAL SENT")
          print("==========================================")
          PY
