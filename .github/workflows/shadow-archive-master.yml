name: Shadow Archive - Master Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 — REPOSITORY
      # ============================================================

      - name: Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2 — PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3 — DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install google-genai


      # ============================================================
      # 4 — YENİ KONU
      # ============================================================

      - name: Generate NEW Topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE — YENİ KONU"
          echo "=========================================="

          python research/research/daily_topic_generator.py


      # ============================================================
      # 5 — KONU KONTROLÜ
      # ============================================================

      - name: Topic Validation
        run: |
          echo "=========================================="
          echo "KONU KONTROLÜ"
          echo "=========================================="

          if [ ! -f "research/current_topic.json" ]; then
            echo "❌ current_topic.json bulunamadı."
            exit 1
          fi

          cat research/current_topic.json

          echo ""
          echo "✅ Yeni konu dosyası hazır."


      # ============================================================
      # 6 — WEB RESEARCH
      # ============================================================

      - name: Web Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE WEB RESEARCH"
          echo "=========================================="

          python research/research/web_research.py


      # ============================================================
      # 7 — SCRIPT
      # ============================================================

      - name: Script Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE SCRIPT"
          echo "=========================================="

          python research/research/script_generator.py


      # ============================================================
      # 8 — TTS
      # ============================================================

      - name: Text To Speech
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE TTS"
          echo "=========================================="

          python research/research/tts_generator.py


      # ============================================================
      # 9 — VISUAL RESEARCH
      # ============================================================

      - name: Visual Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE VISUAL RESEARCH"
          echo "=========================================="

          if [ -z "$PEXELS_API_KEY" ]; then
            echo "❌ PEXELS_API_KEY bulunamadı."
            exit 1
          fi

          echo "✅ PEXELS_API_KEY bulundu."

          python research/research/visual_research.py


      # ============================================================
      # 10 — MAIN VIDEO
      # ============================================================

      - name: Main Video Editor
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE MAIN VIDEO"
          echo "=========================================="

          python research/video/cinematic_video_editor.py


      # ============================================================
      # 11 — MAIN SUBTITLES
      # ============================================================

      - name: Main Video Subtitles
        run: |
          echo "=========================================="
          echo "MAIN VIDEO SUBTITLES"
          echo "=========================================="

          python research/video/subtitles.py


      # ============================================================
      # 12 — SHORTS SELECTOR
      # ============================================================

      - name: Shorts Selector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHORTS SELECTOR"
          echo "=========================================="

          python research/shorts/shorts_selector.py


      # ============================================================
      # 13 — SHORTS TTS
      # ============================================================

      - name: Shorts TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHORTS TTS"
          echo "=========================================="

          python research/shorts/shorts_tts.py


      # ============================================================
      # 14 — SHORTS SUBTITLES
      # ============================================================

      - name: Shorts Subtitles
        run: |
          echo "=========================================="
          echo "SHORTS SUBTITLES"
          echo "=========================================="

          python research/shorts/shorts_subtitles.py


      # ============================================================
      # 15 — SHORTS VIDEO
      # ============================================================

      - name: Shorts Video Editor
        run: |
          echo "=========================================="
          echo "SHORTS VIDEO EDITOR"
          echo "=========================================="

          python research/shorts/shorts_editor.py


      # ============================================================
      # 16 — SHORTS CAPTIONS
      # ============================================================

      - name: Shorts Caption Editor
        run: |
          echo "=========================================="
          echo "SHORTS CAPTION EDITOR"
          echo "=========================================="

          python research/shorts/shorts_caption_editor.py


      # ============================================================
      # 17 — BRANDING
      # ============================================================

      - name: Shorts Branding
        run: |
          echo "=========================================="
          echo "SHORTS BRANDING"
          echo "=========================================="

          python research/shorts/shorts_branding.py


      # ============================================================
      # 18 — GERÇEK DOSYA ARAMA
      # ============================================================

      - name: PRODUCTION DOSYA KONTROLÜ
        run: |
          echo "=========================================="
          echo "PRODUCTION DOSYA KONTROLÜ"
          echo "=========================================="

          echo ""
          echo "📂 REPOSITORY DOSYALARI:"
          find . -type f \
            \( -name "*.mp4" -o -name "*.mov" -o -name "*.mkv" \) \
            -not -path "./.git/*" \
            | sort

          echo ""
          echo "=========================================="
          echo "ANA VIDEO ARANIYOR"
          echo "=========================================="

          MAIN_VIDEO=$(find . -type f \
            -name "main_video.mp4" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$MAIN_VIDEO" ]; then
            echo "❌ main_video.mp4 bulunamadı."
            echo ""
            echo "Bulunan tüm MP4 dosyaları:"
            find . -type f \
              -name "*.mp4" \
              -not -path "./.git/*" \
              | sort
            exit 1
          fi

          echo "✅ ANA VIDEO:"
          echo "$MAIN_VIDEO"


          echo ""
          echo "=========================================="
          echo "SHORT 1 ARANIYOR"
          echo "=========================================="

          SHORT1=$(find . -type f \
            -name "short_1.mp4" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$SHORT1" ]; then
            echo "❌ short_1.mp4 bulunamadı."
            exit 1
          fi

          echo "✅ SHORT 1:"
          echo "$SHORT1"


          echo ""
          echo "=========================================="
          echo "SHORT 2 ARANIYOR"
          echo "=========================================="

          SHORT2=$(find . -type f \
            -name "short_2.mp4" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$SHORT2" ]; then
            echo "❌ short_2.mp4 bulunamadı."
            exit 1
          fi

          echo "✅ SHORT 2:"
          echo "$SHORT2"


          echo ""
          echo "=========================================="
          echo "DOSYA BOYUTLARI"
          echo "=========================================="

          ls -lh "$MAIN_VIDEO"
          ls -lh "$SHORT1"
          ls -lh "$SHORT2"

          echo ""
          echo "✅ TÜM PRODUCTION DOSYALARI BULUNDU."


      # ============================================================
      # 19 — PRODUCTION PACKAGE
      # ============================================================

      - name: Production Package Hazırla
        run: |
          echo "=========================================="
          echo "PRODUCTION PACKAGE"
          echo "=========================================="

          rm -rf production_package

          mkdir -p production_package/main
          mkdir -p production_package/shorts
          mkdir -p production_package/research

          MAIN_VIDEO=$(find . -type f \
            -name "main_video.mp4" \
            -not -path "./.git/*" \
            | head -n 1)

          SHORT1=$(find . -type f \
            -name "short_1.mp4" \
            -not -path "./.git/*" \
            | head -n 1)

          SHORT2=$(find . -type f \
            -name "short_2.mp4" \
            -not -path "./.git/*" \
            | head -n 1)

          cp "$MAIN_VIDEO" \
            production_package/main/main_video.mp4

          cp "$SHORT1" \
            production_package/shorts/short_1.mp4

          cp "$SHORT2" \
            production_package/shorts/short_2.mp4

          cp research/current_topic.json \
            production_package/research/current_topic.json

          if [ -f research/topic_history.json ]; then
            cp research/topic_history.json \
              production_package/research/topic_history.json
          fi

          PRODUCTION_DATE=$(TZ=Europe/Istanbul date +%Y-%m-%d)
          export PRODUCTION_DATE

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          production_date = os.environ["PRODUCTION_DATE"]
          run_id = os.environ["GITHUB_RUN_ID"]

          topic_file = Path(
              "production_package/research/current_topic.json"
          )

          topic = json.loads(
              topic_file.read_text(
                  encoding="utf-8"
              )
          )

          production_id = (
              f"{production_date}-{run_id}"
          )

          metadata = {
              "production_id": production_id,
              "production_date": production_date,
              "run_id": run_id,
              "topic": topic.get("topic", ""),
              "title": topic.get("title", ""),
              "description": topic.get("description", ""),
              "hashtags": topic.get("hashtags", [])
          }

          Path(
              "production_package/production.json"
          ).write_text(
              json.dumps(
                  metadata,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              json.dumps(
                  metadata,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

          echo ""
          echo "=========================================="
          echo "PACKAGE İÇERİĞİ"
          echo "=========================================="

          find production_package -type f -exec ls -lh {} \;


      # ============================================================
      # 20 — PACKAGE VALIDATION
      # ============================================================

      - name: Production Package Validation
        run: |
          echo "=========================================="
          echo "PACKAGE VALIDATION"
          echo "=========================================="

          test -f production_package/main/main_video.mp4
          test -f production_package/shorts/short_1.mp4
          test -f production_package/shorts/short_2.mp4
          test -f production_package/research/current_topic.json
          test -f production_package/production.json

          echo "✅ Ana video hazır."
          echo "✅ Short 1 hazır."
          echo "✅ Short 2 hazır."
          echo "✅ Konu hazır."
          echo "✅ Production metadata hazır."

          echo ""
          echo "PRODUCTION ID:"

          python - <<'PY'
          import json

          with open(
              "production_package/production.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              data["production_id"]
          )

          print(
              "TOPIC:",
              data["topic"]
          )

          print(
              "TITLE:",
              data["title"]
          )
          PY


      # ============================================================
      # 21 — ARTIFACT
      # ============================================================

      - name: Upload Complete Production
        uses: actions/upload-artifact@v4
        with:
          name: shadow-archive-complete-production
          path: production_package
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 22 — TOPIC HISTORY COMMIT
      # ============================================================

      - name: Save Topic History
        run: |
          git config user.name "Shadow Archive Bot"
          git config user.email "shadow-archive-bot@users.noreply.github.com"

          git add research/current_topic.json
          git add research/topic_history.json

          git diff --cached --quiet || \
            git commit -m "Shadow Archive new production topic"

          git push


      # ============================================================
      # 23 — FINAL
      # ============================================================

      - name: Production Complete
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE PRODUCTION TAMAMLANDI"
          echo "=========================================="

          echo "✅ Yeni konu üretildi"
          echo "✅ Araştırma tamamlandı"
          echo "✅ Senaryo tamamlandı"
          echo "✅ TTS tamamlandı"
          echo "✅ Görseller tamamlandı"
          echo "✅ Ana video hazır"
          echo "✅ Short 1 hazır"
          echo "✅ Short 2 hazır"
          echo "✅ Production package hazır"
          echo "✅ Artifact oluşturuldu"

          echo ""
          echo "Telegram onay workflow'u production package'ı kullanabilir."

          echo "=========================================="
