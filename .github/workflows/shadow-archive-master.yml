name: Shadow Archive - Master Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 — CHECKOUT
      # ============================================================

      - name: Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2 — PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3 — DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          echo "=========================================="
          echo "DEPENDENCIES"
          echo "=========================================="

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install google-genai

          echo "=========================================="
          echo "DEPENDENCIES HAZIR"
          echo "=========================================="


      # ============================================================
      # 4 — YENİ KONU
      # ============================================================

      - name: Generate NEW Topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE — YENİ KONU"
          echo "=========================================="

          python research/research/daily_topic_generator.py

          echo ""
          echo "CURRENT TOPIC:"
          cat research/current_topic.json


      # ============================================================
      # 5 — KONU KONTROLÜ
      # ============================================================

      - name: Topic Validation
        run: |
          echo "=========================================="
          echo "KONU KONTROLÜ"
          echo "=========================================="

          if [ ! -f "research/current_topic.json" ]; then
            echo "❌ current_topic.json bulunamadı."
            exit 1
          fi

          python - <<'PY'
          import json

          with open(
              "research/current_topic.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          topic = data.get("topic", "")
          title = data.get("title", "")

          if not topic:
              raise SystemExit("❌ topic boş.")

          if not title:
              raise SystemExit("❌ title boş.")

          print("✅ TOPIC:", topic)
          print("✅ TITLE:", title)
          PY


      # ============================================================
      # 6 — WEB RESEARCH
      # ============================================================

      - name: Web Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE WEB RESEARCH"
          echo "=========================================="

          if [ ! -f "research/research/web_researcher.py" ]; then
            echo "❌ web_researcher.py bulunamadı."
            exit 1
          fi

          echo "✅ web_researcher.py bulundu."

          python research/research/web_researcher.py


      # ============================================================
      # 7 — SCRIPT
      # ============================================================

      - name: Script Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE SCRIPT"
          echo "=========================================="

          python research/research/script_generator.py


      # ============================================================
      # 8 — TTS
      # ============================================================

      - name: Text To Speech
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE TTS"
          echo "=========================================="

          python research/research/tts_generator.py


      # ============================================================
      # 9 — VISUAL RESEARCH
      # ============================================================

      - name: Visual Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE VISUAL RESEARCH"
          echo "=========================================="

          if [ -z "$PEXELS_API_KEY" ]; then
            echo "❌ PEXELS_API_KEY bulunamadı."
            exit 1
          fi

          echo "✅ PEXELS_API_KEY bulundu."

          python research/research/visual_research.py


      # ============================================================
      # 10 — ANA VIDEO
      # ============================================================

      - name: Main Video Editor
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE MAIN VIDEO"
          echo "=========================================="

          python research/research/cinematic_video_editor.py


      # ============================================================
      # 11 — DİNAMİK İNGİLİZCE ALTYAZI
      # ============================================================

      - name: English Subtitles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "ENGLISH SUBTITLES"
          echo "=========================================="

          python research/research/english_subtitle_generator.py


      # ============================================================
      # 12 — SHORTS SELECTOR
      # ============================================================

      - name: Shorts Selector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHORTS SELECTOR"
          echo "=========================================="

          python research/research/shorts_selector.py


      # ============================================================
      # 13 — SHORTS TTS
      # ============================================================

      - name: Shorts TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHORTS TTS"
          echo "=========================================="

          python research/research/shorts_tts.py


      # ============================================================
      # 14 — SHORTS SUBTITLES
      # ============================================================

      - name: Shorts Subtitles
        run: |
          echo "=========================================="
          echo "SHORTS SUBTITLES"
          echo "=========================================="

          python research/research/shorts_subtitles.py


      # ============================================================
      # 15 — SHORTS VIDEO
      # ============================================================

      - name: Shorts Video Editor
        run: |
          echo "=========================================="
          echo "SHORTS VIDEO EDITOR"
          echo "=========================================="

          python research/research/shorts_editor.py


      # ============================================================
      # 16 — SHORTS CAPTIONS
      # ============================================================

      - name: Shorts Caption Editor
        run: |
          echo "=========================================="
          echo "SHORTS CAPTION EDITOR"
          echo "=========================================="

          python research/research/shorts_caption_editor.py


      # ============================================================
      # 17 — SHORTS BRANDING
      # ============================================================

      - name: Shorts Branding
        run: |
          echo "=========================================="
          echo "SHORTS BRANDING"
          echo "=========================================="

          python research/research/shorts_branding.py


      # ============================================================
      # 18 — GERÇEK ÜRETİM DOSYALARINI BUL
      # ============================================================

      - name: PRODUCTION DOSYA KONTROLÜ
        run: |
          echo "=========================================="
          echo "PRODUCTION DOSYA KONTROLÜ"
          echo "=========================================="

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          topic_file = Path(
              "research/current_topic.json"
          )

          if not topic_file.exists():
              raise SystemExit(
                  "❌ current_topic.json bulunamadı."
              )

          data = json.loads(
              topic_file.read_text(
                  encoding="utf-8"
              )
          )

          topic = data["topic"]

          safe_name = topic.lower()

          safe_name = re.sub(
              r"[^a-z0-9]+",
              "_",
              safe_name
          )

          safe_name = safe_name.strip("_")

          if not safe_name:
              safe_name = "daily_topic"

          safe_name = safe_name[:80]

          main_video = Path(
              f"research/video/{safe_name}_v4.mp4"
          )

          short_1 = Path(
              f"research/video/shorts/{safe_name}_short_1.mp4"
          )

          short_2 = Path(
              f"research/video/shorts/{safe_name}_short_2.mp4"
          )

          print("TOPIC:")
          print(topic)

          print("")
          print("SAFE NAME:")
          print(safe_name)

          print("")
          print("ANA VIDEO:")
          print(main_video)

          print("")
          print("SHORT 1:")
          print(short_1)

          print("")
          print("SHORT 2:")
          print(short_2)

          missing = []

          if not main_video.exists():
              missing.append(
                  str(main_video)
              )

          if not short_1.exists():
              missing.append(
                  str(short_1)
              )

          if not short_2.exists():
              missing.append(
                  str(short_2)
              )

          if missing:

              print("")
              print("❌ EKSİK DOSYALAR:")

              for file in missing:
                  print(
                      f"- {file}"
                  )

              print("")
              print("MEVCUT MP4 DOSYALARI:")

              for file in Path(".").rglob("*.mp4"):

                  if ".git" not in file.parts:
                      print(
                          f"- {file}"
                      )

              raise SystemExit(
                  "Production dosyaları eksik."
              )

          print("")
          print("==========================================")
          print("✅ TÜM ÜRETİM DOSYALARI BULUNDU")
          print("==========================================")

          print("")
          print("ANA VIDEO BOYUTU:")
          print(
              f"{main_video.stat().st_size / 1024 / 1024:.2f} MB"
          )

          print("SHORT 1 BOYUTU:")
          print(
              f"{short_1.stat().st_size / 1024 / 1024:.2f} MB"
          )

          print("SHORT 2 BOYUTU:")
          print(
              f"{short_2.stat().st_size / 1024 / 1024:.2f} MB"
          )
          PY


      # ============================================================
      # 19 — PRODUCTION PACKAGE
      # ============================================================

      - name: Production Package Hazırla
        run: |
          echo "=========================================="
          echo "PRODUCTION PACKAGE"
          echo "=========================================="

          rm -rf production_package

          mkdir -p production_package/main
          mkdir -p production_package/shorts
          mkdir -p production_package/research

          python - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          topic_file = Path(
              "research/current_topic.json"
          )

          data = json.loads(
              topic_file.read_text(
                  encoding="utf-8"
              )
          )

          topic = data["topic"]

          safe_name = topic.lower()

          safe_name = re.sub(
              r"[^a-z0-9]+",
              "_",
              safe_name
          )

          safe_name = safe_name.strip("_")

          if not safe_name:
              safe_name = "daily_topic"

          safe_name = safe_name[:80]

          main_video = Path(
              f"research/video/{safe_name}_v4.mp4"
          )

          short_1 = Path(
              f"research/video/shorts/{safe_name}_short_1.mp4"
          )

          short_2 = Path(
              f"research/video/shorts/{safe_name}_short_2.mp4"
          )

          shutil.copy2(
              main_video,
              "production_package/main/main_video.mp4"
          )

          shutil.copy2(
              short_1,
              "production_package/shorts/short_1.mp4"
          )

          shutil.copy2(
              short_2,
              "production_package/shorts/short_2.mp4"
          )

          shutil.copy2(
              "research/current_topic.json",
              "production_package/research/current_topic.json"
          )

          history_file = Path(
              "research/topic_history.json"
          )

          if history_file.exists():

              shutil.copy2(
                  history_file,
                  "production_package/research/topic_history.json"
              )

          production_date = os.environ.get(
              "PRODUCTION_DATE"
          )

          if not production_date:
              raise SystemExit(
                  "PRODUCTION_DATE bulunamadı."
              )

          run_id = os.environ[
              "GITHUB_RUN_ID"
          ]

          production_id = (
              f"{production_date}-{run_id}"
          )

          metadata = {
              "production_id": production_id,
              "production_date": production_date,
              "run_id": run_id,
              "topic": data.get("topic", ""),
              "title": data.get("title", ""),
              "description": data.get("description", ""),
              "hashtags": data.get("hashtags", [])
          }

          Path(
              "production_package/production.json"
          ).write_text(
              json.dumps(
                  metadata,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("")
          print("==========================================")
          print("PACKAGE HAZIR")
          print("==========================================")

          print(
              json.dumps(
                  metadata,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

          echo ""
          echo "PACKAGE DOSYALARI:"

          find production_package \
            -type f \
            -exec ls -lh {} \;


      # ============================================================
      # 20 — PACKAGE VALIDATION
      # ============================================================

      - name: Production Package Validation
        run: |
          echo "=========================================="
          echo "PACKAGE VALIDATION"
          echo "=========================================="

          test -f \
            production_package/main/main_video.mp4

          test -f \
            production_package/shorts/short_1.mp4

          test -f \
            production_package/shorts/short_2.mp4

          test -f \
            production_package/research/current_topic.json

          test -f \
            production_package/production.json

          echo "✅ ANA VIDEO"
          echo "✅ SHORT 1"
          echo "✅ SHORT 2"
          echo "✅ CURRENT TOPIC"
          echo "✅ PRODUCTION JSON"

          echo ""
          echo "PRODUCTION BİLGİLERİ:"

          python - <<'PY'
          import json

          with open(
              "production_package/production.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print(
              "PRODUCTION ID:",
              data["production_id"]
          )

          print(
              "TOPIC:",
              data["topic"]
          )

          print(
              "TITLE:",
              data["title"]
          )
          PY


      # ============================================================
      # 21 — ARTIFACT
      # ============================================================

      - name: Upload Complete Production
        uses: actions/upload-artifact@v4
        with:
          name: shadow-archive-complete-production
          path: production_package
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 22 — TOPIC HISTORY
      # ============================================================

      - name: Save Topic History
        run: |
          echo "=========================================="
          echo "TOPIC HISTORY KAYDEDİLİYOR"
          echo "=========================================="

          git config user.name \
            "Shadow Archive Bot"

          git config user.email \
            "shadow-archive-bot@users.noreply.github.com"

          git add \
            research/current_topic.json

          git add \
            research/topic_history.json

          if git diff --cached --quiet; then

            echo "Değişiklik yok."

          else

            git commit \
              -m "Shadow Archive new production topic"

            git push

          fi


      # ============================================================
      # 23 — TAMAMLANDI
      # ============================================================

      - name: Production Complete
        run: |
          echo ""
          echo "=========================================="
          echo "SHADOW ARCHIVE PRODUCTION TAMAMLANDI"
          echo "=========================================="

          echo "✅ Yeni konu"
          echo "✅ Web research"
          echo "✅ Senaryo"
          echo "✅ TTS"
          echo "✅ Görseller"
          echo "✅ Ana video"
          echo "✅ İngilizce altyazı"
          echo "✅ Short 1"
          echo "✅ Short 2"
          echo "✅ Production package"
          echo "✅ Artifact"

          echo ""
          echo "🎬 ÜRETİM PAKETİ HAZIR."
          echo "=========================================="
