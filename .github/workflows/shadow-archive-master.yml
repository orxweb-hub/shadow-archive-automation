name: Shadow Archive - Master Production

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  production:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python Paketlerini Kur
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install google-genai

      - name: FFmpeg Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      # ==========================================================
      # YENİ KONU
      # ==========================================================

      - name: Yeni Shadow Archive Konusu Üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE — YENİ KONU ÜRETİMİ"
          echo "=========================================="

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ GEMINI_API_KEY bulunamadı."
            exit 1
          fi

          python research/research/daily_topic_generator.py

          echo ""
          echo "=========================================="
          echo "YENİ KONU"
          echo "=========================================="

          cat research/current_topic.json

      # ==========================================================
      # KONU KONTROL
      # ==========================================================

      - name: Yeni Konu Kontrolü
        run: |
          test -f research/current_topic.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("research/current_topic.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          required = [
              "topic",
              "title",
              "description",
              "hashtags"
          ]

          for key in required:
              if key not in data:
                  raise SystemExit(f"❌ Eksik alan: {key}")

          print("TOPIC:", data["topic"])
          print("TITLE:", data["title"])
          print("DESCRIPTION:", data["description"])
          print("HASHTAGS:", data["hashtags"])

          print("✅ YENİ KONU GEÇERLİ.")
          PY

      # ==========================================================
      # WEB RESEARCH
      # ==========================================================

      - name: Web Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/research/web_researcher.py

      # ==========================================================
      # SCRIPT
      # ==========================================================

      - name: Script Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/research/script_generator.py

      # ==========================================================
      # TTS
      # ==========================================================

      - name: TTS Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/research/tts_generator.py

      # ==========================================================
      # VISUAL RESEARCH
      # ==========================================================

      - name: Visual Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "=========================================="
          echo "SHADOW ARCHIVE VISUAL RESEARCH"
          echo "=========================================="

          if [ -z "$PEXELS_API_KEY" ]; then
            echo "❌ PEXELS_API_KEY bulunamadı."
            exit 1
          fi

          echo "✅ PEXELS_API_KEY bulundu."

          python research/research/visual_research.py

      # ==========================================================
      # MAIN VIDEO
      # ==========================================================

      - name: Cinematic Video Editor
        run: |
          python research/research/cinematic_video_editor.py

      # ==========================================================
      # MAIN SUBTITLES
      # ==========================================================

      - name: English Subtitle Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/research/english_subtitle_generator.py

      # ==========================================================
      # SHORTS SELECTOR
      # ==========================================================

      - name: Shorts Selector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/research/shorts_selector.py

      # ==========================================================
      # SHORTS TTS
      # ==========================================================

      - name: Shorts TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/research/shorts_tts.py

      # ==========================================================
      # SHORTS SUBTITLES
      # ==========================================================

      - name: Shorts Subtitles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/research/shorts_subtitles.py

      # ==========================================================
      # SHORTS EDITOR
      # ==========================================================

      - name: Shorts Editor
        run: |
          python research/research/shorts_editor.py

      # ==========================================================
      # SHORTS CAPTIONS
      # ==========================================================

      - name: Shorts Caption Editor
        run: |
          python research/research/shorts_caption_editor.py

      # ==========================================================
      # SHORTS BRANDING
      # ==========================================================

      - name: Shorts Branding
        run: |
          python research/research/shorts_branding.py

      # ==========================================================
      # DOSYA KONTROL
      # ==========================================================

      - name: Production Dosyalarını Kontrol Et
        run: |
          echo "=========================================="
          echo "PRODUCTION DOSYA KONTROLÜ"
          echo "=========================================="

          test -f main_video.mp4
          test -f shorts/short_1.mp4
          test -f shorts/short_2.mp4

          echo "✅ ANA VIDEO:"
          ls -lh main_video.mp4

          echo ""
          echo "✅ SHORT 1:"
          ls -lh shorts/short_1.mp4

          echo ""
          echo "✅ SHORT 2:"
          ls -lh shorts/short_2.mp4

      # ==========================================================
      # PRODUCTION PACKAGE
      # ==========================================================

      - name: Production Package Hazırla
        run: |
          echo "=========================================="
          echo "PRODUCTION PACKAGE OLUŞTURULUYOR"
          echo "=========================================="

          PRODUCTION_DATE=$(TZ=Europe/Istanbul date +%Y-%m-%d)
          PRODUCTION_ID="${PRODUCTION_DATE}-${GITHUB_RUN_ID}"

          echo "Production Date: $PRODUCTION_DATE"
          echo "Production ID: $PRODUCTION_ID"

          rm -rf production_package

          mkdir -p \
            production_package/main \
            production_package/shorts \
            production_package/research \
            production_package/metadata

          cp main_video.mp4 \
            production_package/main/main_video.mp4

          cp shorts/short_1.mp4 \
            production_package/shorts/short_1.mp4

          cp shorts/short_2.mp4 \
            production_package/shorts/short_2.mp4

          cp research/current_topic.json \
            production_package/research/current_topic.json

          if [ -f main_video_english.srt ]; then
            cp main_video_english.srt \
              production_package/main/main_video_english.srt
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          import os

          topic_file = Path("research/current_topic.json")
          data = json.loads(
              topic_file.read_text(encoding="utf-8")
          )

          metadata = {
              "production_id": f"{os.environ.get('PRODUCTION_DATE', '')}-{os.environ.get('GITHUB_RUN_ID', '')}",
              "production_date": os.environ.get("PRODUCTION_DATE", ""),
              "github_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "topic": data.get("topic", ""),
              "title": data.get("title", "")
          }

          Path(
              "production_package/metadata/production.json"
          ).write_text(
              json.dumps(
                  metadata,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )
          PY

          echo ""
          echo "=========================================="
          echo "PACKAGE DOSYALARI"
          echo "=========================================="

          find production_package \
            -type f \
            -exec ls -lh {} \;

      # ==========================================================
      # PACKAGE KONTROL
      # ==========================================================

      - name: Production Package Kontrol
        run: |
          test -f production_package/main/main_video.mp4
          test -f production_package/shorts/short_1.mp4
          test -f production_package/shorts/short_2.mp4
          test -f production_package/research/current_topic.json
          test -f production_package/metadata/production.json

          echo ""
          echo "=========================================="
          echo "✅ PRODUCTION PACKAGE TAMAM"
          echo "=========================================="

          cat production_package/metadata/production.json

      # ==========================================================
      # ARTIFACT
      # ==========================================================

      - name: Production Package Upload
        uses: actions/upload-artifact@v4
        with:
          name: shadow-archive-complete-production
          path: production_package
          retention-days: 7

      # ==========================================================
      # TOPIC HISTORY
      # ==========================================================

      - name: Topic History Kaydet
        run: |
          git config user.name "Shadow Archive Bot"
          git config user.email "shadow-archive-bot@users.noreply.github.com"

          git add research/current_topic.json research/topic_history.json

          if git diff --cached --quiet; then
            echo "ℹ️ Topic değişikliği yok."
          else
            git commit -m "Shadow Archive daily topic update"
            git push origin main
          fi

      # ==========================================================
      # COMPLETE
      # ==========================================================

      - name: Production Complete
        run: |
          echo "=========================================="
          echo "🎉 SHADOW ARCHIVE PRODUCTION TAMAMLANDI"
          echo "=========================================="

          echo ""
          echo "YENİ KONU:"
          cat research/current_topic.json

          echo ""
          echo "Production Run ID:"
          echo "$GITHUB_RUN_ID"

          echo ""
          echo "Telegram onayı için package hazır."

          echo "=========================================="
