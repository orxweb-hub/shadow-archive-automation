name: Shadow Archive - Shorts Selector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Select Shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/research/shorts_selector.py

      - name: Commit Shorts Selection
        run: |
          git config user.name "Shadow Archive Bot"
          git config user.email "shadow-archive@users.noreply.github.com"
          git add research/video/shorts_selection.json
          git commit -m "Generate Shorts selection" || echo "No changes to commit"
          git push
