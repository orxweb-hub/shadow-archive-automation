name: Shadow Archive - TTS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Natural V3 Voice
        run: |
          python research/research/tts_generator.py

      - name: Check Audio
        run: |
          ls -lh research/audio/
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            research/audio/mv_joyita_voice.wav

      - name: Convert WAV to MP3
        run: |
          ffmpeg -y \
            -i research/audio/mv_joyita_voice.wav \
            -codec:a libmp3lame \
            -b:a 96k \
            research/audio/mv_joyita_voice.mp3

      - name: Upload MP3
        uses: actions/upload-artifact@v4
        with:
          name: shadow-archive-voice-v3
          path: research/audio/mv_joyita_voice.mp3
          retention-days: 7
