name: Shadow Archive - Shorts Editor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shorts-editor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Shorts
        run: |
          python research/research/shorts_editor.py

      - name: Check Shorts
        run: |
          ls -lh research/video/shorts/

      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: shadow-archive-shorts
          path: research/video/shorts/shadow_archive_short_*.mp4
          retention-days: 7
